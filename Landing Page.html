<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="21-дневный марафон интегрального развития с Моше Ом. Пробуждение. Трансформация. Новая реальность.">
  <title>Марафон Svarga — Пробуждение · Моше Ом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --deep:       oklch(0.09 0.016 258);
      --surface:    oklch(0.13 0.014 252);
      --surface-2:  oklch(0.17 0.012 248);
      --sage:       oklch(0.50 0.068 152);
      --sage-dim:   oklch(0.34 0.050 152);
      --gold:       oklch(0.79 0.09  84);
      --gold-light: oklch(0.87 0.06  82);
      --gold-dim:   oklch(0.62 0.07  84);
      --cream:      oklch(0.96 0.022 85);
      --cream-2:    oklch(0.91 0.026 83);
      --text-1:     oklch(0.93 0.010 82);
      --text-2:     oklch(0.70 0.016 82);
      --text-3:     oklch(0.48 0.012 80);
      --text-dark:  oklch(0.15 0.012 255);
      --text-dark-2:oklch(0.35 0.014 250);
      --font-display:'Cormorant Garamond', Georgia, serif;
      --font-body:  'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--deep);
      color: var(--text-1);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--deep); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
    ::selection { background: oklch(0.79 0.09 84 / 0.22); }
    img { display: block; max-width: 100%; }

    /* ── SCROLL REVEAL ── */
    .reveal {
      opacity: 0; transform: translateY(22px);
      transition: opacity 0.85s cubic-bezier(0.2,0,0.2,1), transform 0.85s cubic-bezier(0.2,0,0.2,1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-left  { opacity: 0; transform: translateX(-22px); transition: opacity 0.85s cubic-bezier(0.2,0,0.2,1), transform 0.85s cubic-bezier(0.2,0,0.2,1); }
    .reveal-right { opacity: 0; transform: translateX(22px);  transition: opacity 0.85s cubic-bezier(0.2,0,0.2,1), transform 0.85s cubic-bezier(0.2,0,0.2,1); }
    .reveal-left.visible, .reveal-right.visible { opacity: 1; transform: none; }
    .d1 { transition-delay: 0.10s; }
    .d2 { transition-delay: 0.20s; }
    .d3 { transition-delay: 0.30s; }
    .d4 { transition-delay: 0.42s; }
    .d5 { transition-delay: 0.54s; }
    .d6 { transition-delay: 0.66s; }
    .d7 { transition-delay: 0.78s; }

    /* ── TYPOGRAPHY ── */
    .eyebrow {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .eyebrow-sage { color: var(--sage); }
    .gold-line {
      flex-shrink: 0;
      width: 40px; height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      opacity: 0.65;
    }
    .gold-line-rev { background: linear-gradient(270deg, var(--gold), transparent); }

    /* ── BUTTONS ── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 38px;
      background: var(--gold);
      color: var(--deep);
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.13em; text-transform: uppercase;
      border: none; border-radius: 2px; cursor: pointer; text-decoration: none;
      transition: background 0.3s, transform 0.25s, box-shadow 0.3s;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 16px 48px oklch(0.79 0.09 84 / 0.30);
    }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 36px;
      background: transparent; color: var(--text-2);
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 400;
      letter-spacing: 0.09em; text-transform: uppercase;
      border: 1px solid oklch(0.93 0.01 82 / 0.22);
      border-radius: 2px; cursor: pointer; text-decoration: none;
      transition: border-color 0.3s, color 0.3s;
    }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

    /* ── NAV SCROLL STATE ── */
    nav.scrolled {
      background: oklch(0.09 0.016 258 / 0.92) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border-bottom: 1px solid oklch(0.79 0.09 84 / 0.10) !important;
    }

    /* ── CARDS ── */
    .glass-card {
      background: oklch(0.97 0.01 82 / 0.055);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid oklch(0.97 0.01 82 / 0.10);
      border-radius: 3px;
    }
    .practice-card {
      transition: transform 0.3s, border-color 0.3s, background 0.3s;
    }
    .practice-card:hover {
      transform: translateY(-5px);
      border-color: oklch(0.79 0.09 84 / 0.28) !important;
      background: oklch(0.97 0.01 82 / 0.09) !important;
    }
    .testimonial-card { transition: transform 0.3s; }
    .testimonial-card:hover { transform: translateY(-4px); }

    /* ── PROGRAM BLOCK ── */
    .program-block {
      border-left: 2px solid oklch(0.79 0.09 84 / 0.18);
      transition: border-color 0.3s;
    }
    .program-block:hover { border-left-color: var(--gold); }

    /* ── ANIMATIONS ── */
    @keyframes glow-pulse {
      0%,100% { box-shadow: 0 0 28px oklch(0.79 0.09 84 / 0.18); }
      50%      { box-shadow: 0 0 56px oklch(0.79 0.09 84 / 0.42); }
    }
    .glow-pulse { animation: glow-pulse 3.2s ease-in-out infinite; }

    @keyframes scroll-drop {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%     { transform: translateY(8px); opacity: 0.9; }
    }
    .scroll-drop { animation: scroll-drop 2.4s ease-in-out infinite; }

    @keyframes hero-fade {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }
    .hero-line-1 { animation: hero-fade 1.0s cubic-bezier(0.2,0,0.2,1) 0.3s both; }
    .hero-line-2 { animation: hero-fade 1.0s cubic-bezier(0.2,0,0.2,1) 0.5s both; }
    .hero-line-3 { animation: hero-fade 1.0s cubic-bezier(0.2,0,0.2,1) 0.7s both; }
    .hero-line-4 { animation: hero-fade 1.0s cubic-bezier(0.2,0,0.2,1) 0.9s both; }
    .hero-line-5 { animation: hero-fade 1.0s cubic-bezier(0.2,0,0.2,1) 1.1s both; }

    /* ── LAYOUT ── */
    .section-pad { padding: clamp(72px,10vw,140px) clamp(24px,7.5vw,112px); }
    .max-w      { max-width: 1280px; margin: 0 auto; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .mobile-hide { display: none !important; }
      .mobile-center { text-align: center !important; align-items: center !important; }
      .mobile-col { flex-direction: column !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
