<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LifeForge AI — Premium transformation ecosystem.">
<title>LifeForge AI · Human Potential System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23E8C880'/><stop offset='1' stop-color='%239A7E4A'/></linearGradient></defs><circle cx='16' cy='16' r='14' fill='url(%23g)'/><text x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='17' fill='%230D0B08' font-weight='600'>L</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0907;--bg-alt:#110E0A;--surface:#18140E;--surface-2:#211C14;
  --text-1:#F0EBE0;--text-2:#AAA49A;--text-3:#6B6660;
  --border:rgba(240,235,224,.08);--border-md:rgba(240,235,224,.16);
  --gold:#D4B27A;--gold-h:#E8C68E;--gold-dim:#9A7E4A;--gold-f:rgba(212,178,122,.10);
  --indigo:#7E8EC8;--indigo-f:rgba(126,142,200,.10);
  --sage:#6EA080;--purple:#B07ECC;--purple-f:rgba(176,126,204,.10);
  --amber:#C8946E;--platinum:#C8D4E0;
  --shadow:rgba(0,0,0,.7);--nav-bg:rgba(10,9,7,.88);
  --glass-bg:rgba(24,20,14,.52);--glass-br:rgba(240,235,224,.10);
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-b:'DM Sans',system-ui,sans-serif;
  --r:12px;--r2:20px;
}
[data-theme="light"]{
  --bg:#FAF7EF;--bg-alt:#F2EFE5;--surface:#FFFFFF;--surface-2:#EDE9DE;
  --text-1:#1A160E;--text-2:#56524C;--text-3:#989188;
  --border:rgba(24,20,14,.08);--border-md:rgba(24,20,14,.16);
  --gold:#8B6520;--gold-h:#6E4F12;--gold-dim:#B08030;--gold-f:rgba(139,101,32,.08);
  --indigo:#5068B8;--indigo-f:rgba(80,104,184,.08);
  --sage:#3E7058;--purple:#8050AC;--purple-f:rgba(128,80,172,.08);
  --amber:#A06040;--platinum:#5878A0;
  --shadow:rgba(24,20,14,.1);--nav-bg:rgba(250,247,239,.92);
  --glass-bg:rgba(255,255,255,.60);--glass-br:rgba(24,20,14,.10);
}
[lang="he"]{--font-d:'Frank Ruhl Libre',Georgia,serif;--font-b:'Heebo',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--bg);color:var(--text-1);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
::selection{background:rgba(212,178,122,.22)}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-b)}
input,textarea{font-family:var(--font-b)}
img{display:block;max-width:100%}

/* PARTICLE CANVAS */
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
[data-theme="light"] #particle-canvas{opacity:.22}

/* ORBS */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(100px);transition:opacity 1s,background 1s}
.o1{top:-8%;left:-6%;width:620px;height:620px}
.o2{bottom:-18%;right:-8%;width:700px;height:700px;opacity:.6}
.o3{top:38%;right:22%;width:420px;height:420px;opacity:.4}

/* LAYOUT */
.sp{padding:clamp(56px,9vw,112px) clamp(22px,7vw,100px);position:relative;z-index:1}
.sp2{padding:clamp(40px,6vw,80px) clamp(22px,7vw,100px);position:relative;z-index:1}
.mw{max-width:1320px;margin:0 auto}

/* REVEAL */
.rv{opacity:0;transform:translateY(22px);transition:opacity .85s cubic-bezier(.2,0,.2,1),transform .85s cubic-bezier(.2,0,.2,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.06s}.d2{transition-delay:.14s}.d3{transition-delay:.22s}
.d4{transition-delay:.30s}.d5{transition-delay:.38s}.d6{transition-delay:.46s}

/* TYPOGRAPHY */
.eyebrow{font-size:.60rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
[lang="he"] .eyebrow{letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(--gold-f);border:1px solid rgba(212,178,122,.18);border-radius:99px;font-size:.60rem;font-weight:500;letter-spacing:.20em;text-transform:uppercase;color:var(--gold)}

/* BUTTONS */
.btn-p{display:inline-flex;align-items:center;gap:8px;padding:13px 30px;background:var(--gold);color:#0A0907;font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;border:none;border-radius:var(--r);cursor:pointer;transition:all .3s}
.btn-p:hover{background:var(--gold-h);transform:translateY(-2px);box-shadow:0 16px 48px rgba(212,178,122,.28)}
[data-theme="light"] .btn-p{color:#FAF7EF}
.btn-g{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:transparent;color:var(--text-2);font-size:.72rem;font-weight:400;letter-spacing:.10em;text-transform:uppercase;border:1px solid var(--border-md);border-radius:var(--r);cursor:pointer;transition:all .3s}
.btn-g:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-f)}

/* NAV */
nav.topnav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 clamp(22px,7vw,100px);height:66px;display:flex;align-items:center;justify-content:space-between;transition:background .4s,box-shadow .4s;gap:16px}
nav.topnav.scrolled{background:var(--nav-bg);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 1px 0 var(--border),0 8px 32px var(--shadow)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.nav-logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:18px;font-weight:600;color:#0A0907;box-shadow:0 4px 14px rgba(212,178,122,.28)}
.nav-logo-text{font-family:var(--font-d);font-size:1.18rem;font-weight:500}
.nav-logo-sub{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3)}
.nav-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-lang{padding:6px 10px;font-size:.62rem;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--text-3);background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .25s}
.nav-lang.active,.nav-lang:hover{color:var(--gold);border-color:rgba(212,178,122,.28);background:var(--gold-f)}
.nav-theme{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text-2);font-size:15px;transition:all .25s}
.nav-theme:hover{color:var(--gold);border-color:rgba(212,178,122,.28);background:var(--gold-f)}

/* LAYER TABS */
.layer-tabs{display:flex;gap:6px;padding:5px;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--glass-br);border-radius:12px}
.layer-tab{padding:9px 20px;font-size:.70rem;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--text-3);background:none;border:none;border-radius:8px;cursor:pointer;transition:all .3s;white-space:nowrap}
.layer-tab:hover{color:var(--text-1)}
.layer-tab.active{color:#0A0907;background:var(--gold);box-shadow:0 4px 14px rgba(212,178,122,.28)}
[data-theme="light"] .layer-tab.active{color:#FAF7EF}
.layer-tab.indigo.active{background:var(--indigo);color:#0A0907}
.layer-tab.purple.active{background:var(--purple);color:#0A0907}
[data-theme="light"] .layer-tab.indigo.active,[data-theme="light"] .layer-tab.purple.active{color:#FAF7EF}

/* HERO */
.hero{min-height:88svh;display:flex;align-items:center;padding:96px clamp(22px,7vw,100px) clamp(48px,8vw,96px);position:relative;z-index:1}
.hero-inner{max-width:1320px;margin:0 auto;width:100%}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:var(--gold-f);border:1px solid rgba(212,178,122,.20);border-radius:99px;margin-bottom:28px}
.hero-tag-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse-dot 2.4s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(212,178,122,.5)}50%{box-shadow:0 0 0 6px rgba(212,178,122,0)}}
.hero-h{font-family:var(--font-d);font-size:clamp(2.8rem,7vw,6.4rem);font-weight:300;line-height:1.05;letter-spacing:-.01em;margin-bottom:24px}
.hero-h em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:clamp(.95rem,1.6vw,1.12rem);color:var(--text-2);max-width:580px;line-height:1.72;margin-bottom:38px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:56px}
.hero-stats{display:flex;flex-wrap:wrap;gap:clamp(24px,3.5vw,48px)}
.hero-stat-val{font-family:var(--font-d);font-size:clamp(1.7rem,2.8vw,2.4rem);font-weight:400;color:var(--gold);line-height:1}
.hero-stat-lab{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:4px}

/* SECTION HEAD */
.sec-head{margin-bottom:clamp(36px,5vw,64px);text-align:center}
.sec-h{font-family:var(--font-d);font-size:clamp(2rem,4.2vw,3.3rem);font-weight:300;line-height:1.12;margin-top:12px}
.sec-h em{font-style:italic;color:var(--gold)}
.sec-sub{font-size:clamp(.86rem,1.3vw,.96rem);color:var(--text-2);max-width:580px;margin:14px auto 0;line-height:1.7}
.divider{width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto 0;opacity:.6}

/* GLASS CARD */
.glass{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--glass-br);border-radius:var(--r2);position:relative;overflow:hidden}

/* COACH CARD */
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.coach-card{padding:28px;cursor:pointer;transition:all .35s cubic-bezier(.2,0,.2,1);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.coach-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 0% 100%,var(--card-accent,rgba(212,178,122,.08)),transparent 60%);opacity:0;transition:opacity .4s}
.coach-card:hover{transform:translateY(-6px);box-shadow:0 24px 56px rgba(0,0,0,.28);border-color:var(--accent,rgba(212,178,122,.4))}
.coach-card:hover::before{opacity:1}
.coach-avatar{width:88px;height:88px;border-radius:50%;flex-shrink:0;border:2px solid var(--accent,var(--gold));background:linear-gradient(135deg,var(--bg-alt),var(--surface));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.coach-avatar-status{position:absolute;bottom:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#6EA080;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--bg)}
.coach-name{font-family:var(--font-d);font-size:1.45rem;font-weight:400;line-height:1.15}
.coach-title{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent,var(--gold));margin-top:3px;margin-bottom:10px}
.coach-quote{font-size:.84rem;color:var(--text-2);line-height:1.65;font-style:italic;flex:1}
.coach-meta{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.coach-rating{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--text-2)}
.coach-rating-star{color:var(--gold)}
.coach-sessions{font-size:.66rem;color:var(--text-3);letter-spacing:.10em;text-transform:uppercase}

/* COACH DETAIL */
.detail-page{min-height:100svh;padding:96px clamp(22px,7vw,100px) clamp(56px,8vw,100px);position:relative;z-index:1}
.detail-back{display:inline-flex;align-items:center;gap:8px;font-size:.70rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);cursor:pointer;margin-bottom:40px;transition:all .25s;background:none;border:none}
.detail-back:hover{color:var(--text-2);gap:12px}
.detail-grid{display:grid;grid-template-columns:380px 1fr;gap:48px;align-items:start}
.detail-profile{position:sticky;top:96px}
.detail-profile .coach-avatar{width:140px;height:140px;margin-bottom:20px}
.detail-profile-h{font-family:var(--font-d);font-size:2.2rem;font-weight:400;line-height:1.1;margin-bottom:6px}
.detail-profile-title{font-size:.72rem;letter-spacing:.20em;text-transform:uppercase;color:var(--accent,var(--gold));margin-bottom:18px}
.detail-profile-bio{font-size:.88rem;color:var(--text-2);line-height:1.72;margin-bottom:20px}
.detail-profile-phil{font-size:.86rem;font-style:italic;color:var(--text-1);line-height:1.7;padding:14px 18px;border-left:2px solid var(--accent,var(--gold));background:var(--gold-f);border-radius:0 8px 8px 0;margin-bottom:24px}
.detail-profile-specs{display:flex;flex-wrap:wrap;gap:6px}
.spec-pill{padding:4px 11px;border-radius:99px;font-size:.62rem;letter-spacing:.10em;text-transform:uppercase;border:1px solid var(--accent,var(--gold));color:var(--accent,var(--gold));opacity:.85}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100svh - 200px);min-height:520px}
.chat-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.chat-header-info{flex:1}
.chat-header-name{font-family:var(--font-d);font-size:1.05rem;font-weight:500}
.chat-header-status{font-size:.66rem;letter-spacing:.10em;text-transform:uppercase;color:#6EA080;display:flex;align-items:center;gap:6px;margin-top:2px}
.chat-status-dot{width:6px;height:6px;border-radius:50%;background:#6EA080;animation:pulse-dot 2.4s ease-in-out infinite}
.chat-msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:13px 18px;border-radius:14px;font-size:.88rem;line-height:1.62;animation:msg-in .35s ease-out}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.coach{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text-1);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--gold);color:#0A0907;border-bottom-right-radius:4px}
[data-theme="light"] .msg.user{color:#FAF7EF}
.msg-meta{font-size:.60rem;letter-spacing:.10em;text-transform:uppercase;opacity:.55;margin-bottom:4px}
.typing-indicator{align-self:flex-start;display:flex;gap:5px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:typing 1.4s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.30s}
@keyframes typing{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}
.chat-input-row{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.chat-input{flex:1;padding:13px 18px;background:var(--surface-2);border:1px solid var(--border-md);border-radius:10px;color:var(--text-1);font-size:.88rem;outline:none;transition:border-color .25s;resize:none;font-family:var(--font-b);line-height:1.5;min-height:48px;max-height:120px}
.chat-input:focus{border-color:var(--gold)}
.chat-send{padding:0 22px;background:var(--gold);color:#0A0907;border:none;border-radius:10px;font-size:.72rem;font-weight:500;letter-spacing:.10em;text-transform:uppercase;cursor:pointer;transition:all .25s}
.chat-send:hover{background:var(--gold-h);transform:translateY(-1px)}
.chat-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
[data-theme="light"] .chat-send{color:#FAF7EF}

/* ESOTERIC TOOLS */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tool-card{padding:24px;cursor:pointer;transition:all .35s;display:flex;flex-direction:column;gap:14px;min-height:200px}
.tool-card:hover{transform:translateY(-5px);box-shadow:0 20px 48px rgba(0,0,0,.25);border-color:var(--accent,var(--indigo))}
.tool-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:1.6rem;color:var(--accent,var(--indigo));background:var(--accent-bg,var(--indigo-f));border:1px solid var(--accent,var(--indigo))}
.tool-name{font-family:var(--font-d);font-size:1.32rem;font-weight:400;line-height:1.2}
.tool-desc{font-size:.82rem;color:var(--text-2);line-height:1.62;flex:1}
.tool-cta{display:flex;align-items:center;gap:7px;font-size:.66rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,var(--indigo));margin-top:8px}

/* FORM */
.form-stack{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.form-input,.form-textarea{padding:12px 16px;background:var(--surface-2);border:1px solid var(--border-md);border-radius:10px;color:var(--text-1);font-size:.88rem;outline:none;transition:border-color .25s;font-family:var(--font-b)}
.form-input:focus,.form-textarea:focus{border-color:var(--gold)}
.form-textarea{min-height:120px;resize:vertical;line-height:1.6}

/* PYTHAGORAS */
.pytha-grid{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin:24px auto;justify-content:center}
.pytha-cell{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:1.4rem;border:1px solid var(--border)}
.pytha-cell.has{border-color:rgba(212,178,122,.4);background:rgba(212,178,122,.08);color:var(--gold)}
.pytha-cell.hot{border-color:rgba(212,178,122,.7);background:rgba(212,178,122,.16);color:var(--gold-h);box-shadow:0 0 16px rgba(212,178,122,.18)}
.pytha-cell.empty{color:var(--text-3);opacity:.4}
.working-nums{display:flex;justify-content:center;gap:24px;margin:20px 0;flex-wrap:wrap}
.wnum{text-align:center}
.wnum-val{font-family:var(--font-d);font-size:1.7rem;color:var(--gold)}
.wnum-lab{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:2px}

/* RUNES */
.runes-display{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}
.rune-card{padding:24px 18px;text-align:center;border:1px solid var(--glass-br);border-radius:14px;background:var(--glass-bg);position:relative;animation:rune-in .8s cubic-bezier(.2,0,.2,1) both}
.rune-card:nth-child(2){animation-delay:.18s}
.rune-card:nth-child(3){animation-delay:.36s}
@keyframes rune-in{from{opacity:0;transform:translateY(20px) rotateY(60deg)}to{opacity:1;transform:none}}
.rune-pos{font-size:.58rem;letter-spacing:.20em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
.rune-symbol{font-size:3.4rem;color:var(--indigo);font-family:'Cormorant Garamond',serif;margin:0 0 12px;line-height:1;filter:drop-shadow(0 0 16px rgba(126,142,200,.4))}
.rune-name{font-family:var(--font-d);font-size:1.15rem;color:var(--text-1);margin-bottom:8px}
.rune-meaning{font-size:.78rem;color:var(--text-2);line-height:1.62}

/* ARCHETYPES */
.quiz-q{padding:24px;border-radius:14px;background:var(--glass-bg);border:1px solid var(--glass-br);margin-bottom:14px}
.quiz-q-text{font-family:var(--font-d);font-size:1.18rem;margin-bottom:18px;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:8px}

<canvas id="particle-canvas"></canvas>
<div class="orbs"><div class="orb o1" id="orb1"></div><div class="orb o2" id="orb2"></div><div class="orb o3" id="orb3"></div></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>
(function(){
  const canvas=document.getElementById('particle-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  const N=78,CONN=130,SPEED=.26;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;init()}
  function init(){pts=[];for(let i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*SPEED,vy:(Math.random()-.5)*SPEED,r:Math.random()*1.4+.4})}
  function isDark(){return document.documentElement.getAttribute('data-theme')!=='light'}
  function layerColor(){
    const layer=document.documentElement.getAttribute('data-layer')||'coach';
    const dark=isDark();
    if(layer==='esoteric')return dark?'126,142,200':'80,104,184';
    if(layer==='svarga')return dark?'176,126,204':'128,80,172';
    return dark?'212,178,122':'139,101,32';
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const c=layerColor();
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<CONN){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(${c},${(1-d/CONN)*.22})`;ctx.lineWidth=.6;ctx.stroke()}
    }
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${c},.55)`;ctx.fill()});
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();draw();
})();
function updateOrbs(layer){
  const o1=document.getElementById('orb1'),o2=document.getElementById('orb2'),o3=document.getElementById('orb3');
  const colors={
    coach:['rgba(212,178,122,.32)','rgba(200,148,110,.18)','rgba(110,160,128,.14)'],
    esoteric:['rgba(126,142,200,.28)','rgba(126,142,200,.18)','rgba(110,160,128,.12)'],
    svarga:['rgba(176,126,204,.30)','rgba(126,142,200,.18)','rgba(176,126,204,.14)']
  };
  const c=colors[layer]||colors.coach;
  o1.style.background=`radial-gradient(circle,${c[0]},transparent 68%)`;
  o2.style.background=`radial-gradient(circle,${c[1]},transparent 68%)`;
  o3.style.background=`radial-gradient(circle,${c[2]},transparent 68%)`;
}
updateOrbs('coach');
</script>

   philosophy:{en:'Clarity precedes mastery. Every decision is a vote for the leader you are becoming.',ru:'Ясность предшествует мастерству. Каждое решение — голос за лидера, которым вы становитесь.',es:'La claridad precede a la maestría. Cada decisión es un voto por el líder en que te estás convirtiendo.',it:'La chiarezza precede la maestria. Ogni decisione è un voto per il leader che stai diventando.',he:'בהירות קודמת לשליטה. כל החלטה היא קול עבור המנהיג שאתה הופך להיות.'},
   responses:{en:["Your instinct here is directionally correct — but let's sharpen the edge. The pattern I see in high-stakes decision-making is the tendency to optimize for comfort rather than clarity. What would you choose if failure wasn't a signal of inadequacy, but simply data? That reframe changes everything. Let me ask you this: when was the last time you made a decision from your values rather than your fears?","Strategic clarity doesn't emerge from more information — it emerges from better questions. You've identified the challenge accurately. Now here's what separates top performers: they build decision frameworks *before* pressure hits. What are your three non-negotiables in this situation? Name them, and watch how the path forward becomes obvious.","The resistance you're feeling is not a weakness — it's intelligence. Every high performer I've worked with experiences exactly this. The body knows when something is misaligned. Let's reverse-engineer what alignment actually looks like here. Describe the outcome you'd be proud of in five years. Now describe the one you're afraid of. The gap between those two is exactly where your work is."],
    ru:["Ваш инстинкт в правильном направлении — но давайте заострим. Паттерн, который я вижу в принятии решений с высокими ставками — тенденция оптимизироваться под комфорт, а не под ясность. Что бы вы выбрали, если бы провал был не сигналом неадекватности, а просто данными? Этот рефрейм меняет всё. Позвольте спросить: когда вы в последний раз принимали решение из своих ценностей, а не из страхов?","Стратегическая ясность не приходит от большего количества информации — она приходит от лучших вопросов. Вы точно определили вызов. Теперь вот что отличает топ-перформеров: они строят фреймворки решений *до* того, как давление нарастает. Каковы ваши три «нельзя» в этой ситуации?","Сопротивление, которое вы чувствуете — не слабость, это интеллект. Каждый высокоэффективный человек, с которым я работал, переживает именно это. Тело знает, когда что-то не согласовано. Опишите результат, которым вы будете гордиться через пять лет."]}

   title:{en:'Transformational Psychologist',ru:'Трансформационный Психолог',es:'Psicóloga Transformacional',it:'Psicologa Trasformazionale',he:'פסיכולוגית טרנספורמציה'},
   bio:{en:'Clinical psychologist with 18 years in depth psychology and somatic healing. Bridges neuroscience with ancient wisdom traditions to create lasting behavioral change.',ru:'Клинический психолог с 18-летним опытом в глубинной психологии и соматическом исцелении. Соединяет нейронауку с древними мудрыми традициями.',es:'Psicóloga clínica con 18 años en psicología profunda y sanación somática.',it:'Psicologa clinica con 18 anni in psicologia profonda e guarigione somatica.',he:'פסיכולוגית קלינית עם 18 שנה בפסיכולוגיה עמוקה וריפוי סומטי.'},
   specialties:{en:['Shadow Integration','Emotional Intelligence','Somatic Healing','Relationship Patterns'],ru:['Интеграция тени','Эмоциональный интеллект','Соматическое исцеление','Паттерны отношений'],es:['Integración de la Sombra','Inteligencia Emocional','Sanación Somática','Patrones de Relación'],it:['Integrazione dell\'Ombra','Intelligenza Emotiva','Guarigione Somatica','Schemi Relazionali'],he:['אינטגרציה של הצל','אינטליגנציה רגשית','ריפוי סומטי','דפוסי מערכות יחסים']},
   philosophy:{en:'The wound is where the light enters. Integration — not elimination — is the path to wholeness.',ru:'Рана — это место, где входит свет. Интеграция, а не устранение — путь к целостности.',es:'La herida es donde entra la luz. La integración — no la eliminación — es el camino hacia la plenitud.',it:"La ferita è dove entra la luce. L'integrazione — non l'eliminazione — è il cammino verso la completezza.",he:'הפצע הוא המקום שבו הכניסה האור. אינטגרציה — לא ביטול — היא הדרך לשלמות.'},
   responses:{en:["What you're describing lives in the body before it reaches the mind. That's not metaphor — that's neuroscience. The autonomic nervous system stores relational patterns as somatic memory. When you notice this feeling, where exactly do you feel it physically? That location is the doorway. Most people try to think their way through emotional patterns. The deeper path is to *feel* your way through — with precision and compassion, not willpower.","The shadow isn't the enemy — it's the exile. Those parts of yourself you've locked away to stay acceptable, safe, loved. But exiles don't disappear; they find other ways to express. What you're experiencing right now is a communication from a part of you that has been waiting for witness. I want you to sit with this: what story does this feeling have to tell you?","Relationship patterns are never random. They are exquisitely precise repetitions of early attachment architecture. When you describe this dynamic, I hear a very specific template — one formed long before this relationship existed. The question isn't 'why do they do this?' but 'what in me recognizes and recreates this?' That's where agency lives."],
    ru:["То, что вы описываете, живёт в теле до того, как достигает разума. Это не метафора — это нейронаука. Автономная нервная система хранит реляционные паттерны как соматическую память. Когда вы замечаете это чувство — где именно в теле вы его ощущаете? Это место — дверь.","Тень — не враг, это изгнанник. Те части себя, которые вы заперли, чтобы оставаться приемлемым, в безопасности, любимым. Но изгнанники не исчезают — они находят другие пути выражения. Чего ждёт эта часть вас, которая долго ждала свидетеля?","Паттерны отношений никогда не случайны. Они — точнейшие повторения ранней архитектуры привязанности. Вопрос не «почему они так делают?», а «что во мне узнаёт и воссоздаёт это?» Именно там живёт агентность."]}

   bio:{en:'Former Olympic athlete and neuroscience researcher. Developed the NeuroFlow Method for peak mental performance. Coaches elite athletes, Navy SEALs, and tech founders.',ru:'Бывший олимпийский атлет и исследователь нейронауки. Разработал метод NeuroFlow для пиковой ментальной производительности.',es:'Ex atleta olímpico e investigador de neurociencias. Desarrolló el Método NeuroFlow para el rendimiento mental óptimo.',it:'Ex atleta olimpico e ricercatore di neuroscienze. Ha sviluppato il Metodo NeuroFlow per le massime prestazioni mentali.',he:'ספורטאי אולימפי לשעבר וחוקר מדעי המוח. פיתח את שיטת NeuroFlow לביצועים מנטליים.'},
   specialties:{en:['Flow State Activation','Mental Resilience','Performance Anxiety','Athletic Psychology'],ru:['Активация состояния потока','Ментальная устойчивость','Тревога производительности','Спортивная психология'],es:['Activación del Estado de Flujo','Resiliencia Mental','Ansiedad de Rendimiento','Psicología Atlética'],it:['Attivazione del Flusso','Resilienza Mentale','Ansia da Prestazione','Psicologia Atletica'],he:['הפעלת מצב זרימה','חוסן מנטלי','חרדת ביצועים','פסיכולוגיה אתלטית']},
   philosophy:{en:'The mind follows the breath. The body follows the mind. Master the breath, and you hold the key to everything.',ru:'Разум следует за дыханием. Тело следует за разумом. Овладей дыханием — и у тебя есть ключ ко всему.',es:'La mente sigue a la respiración. El cuerpo sigue a la mente. Domina la respiración y tendrás la clave de todo.',it:'La mente segue il respiro. Il corpo segue la mente. Padroneggia il respiro e avrai la chiave di tutto.',he:'המוח עוקב אחר הנשימה. הגוף עוקב אחר המוח. שלוט בנשימה ויש לך את המפתח לכל.'},
   responses:{en:["Every elite performer I've trained — Olympic medalists, special ops, founders running billion-dollar decisions — faces exactly this wall. The wall isn't an obstacle. It's a threshold. Your nervous system is doing exactly what it's designed to do: protecting you from novelty that might be dangerous. Here's the protocol: 4-7-8 breathing for 3 cycles right now. Inhale 4, hold 7, exhale 8. Notice what shifts. Then tell me what you're actually afraid of beneath the surface goal.","Flow state isn't luck — it's a neurological condition you can engineer. The three variables: challenge slightly exceeding skill, clear immediate goals, and complete elimination of self-monitoring. You're breaking the third one. The internal observer — the one judging your performance in real time — is the flow killer. Let's design a pre-performance ritual that quiets it. What does your routine look like 30 minutes before peak performance?","Mental resilience isn't the absence of breaking — it's the speed of recovery. The Navy SEALs call it 'embracing the suck.' Not enjoying difficulty, but removing the story that difficulty is wrong. What story are you telling yourself about this situation? Because that story — not the situation itself — is what's costing you performance."],
    ru:["Каждый элитный исполнитель, которого я тренировал — олимпийские призёры, спецназ, основатели принимающие решения на миллиарды — сталкивается именно с этой стеной. Стена — не препятствие. Это порог. Ваша нервная система делает именно то, для чего создана: защищает вас от новизны, которая может быть опасной.","Состояние потока — не удача, это неврологическое состояние, которое можно создать. Три переменных: вызов слегка превышает навык, чёткие немедленные цели, и полное устранение самомониторинга. Давайте спроектируем предперформационный ритуал.","Ментальная устойчивость — не отсутствие срывов, а скорость восстановления. Военные называют это «обнять страдание». Какую историю вы рассказываете себе об этой ситуации?"]}

   specialties:{en:['Life Architecture','Career Reinvention','Values Alignment','Purpose Discovery'],ru:['Архитектура жизни','Переизобретение карьеры','Выравнивание ценностей','Открытие предназначения'],es:['Arquitectura de Vida','Reinvención de Carrera','Alineación de Valores','Descubrimiento de Propósito'],it:['Architettura di Vita','Reinvenzione della Carriera','Allineamento dei Valori','Scoperta dello Scopo'],he:['ארכיטקטורת חיים','המצאה מחדש של קריירה','התאמת ערכים','גילוי מטרה']},
   philosophy:{en:"You don't find your purpose — you build it. Life design is the most important project you'll ever run.",ru:'Ты не находишь своё предназначение — ты создаёшь его. Дизайн жизни — самый важный проект, который ты когда-либо запустишь.',es:'No encuentras tu propósito — lo construyes. El diseño de vida es el proyecto más importante que jamás ejecutarás.',it:'Non trovi il tuo scopo — lo costruisci. Il life design è il progetto più importante che realizzerai mai.',he:'אתה לא מוצא את המטרה שלך — אתה בונה אותה. עיצוב חיים הוא הפרויקט החשוב ביותר שתנהל אי פעם.'},
   responses:{en:["What I'm hearing is a values conflict dressed up as a strategy problem. You're framing this as 'what should I do?' but the real question is 'who am I designing for?' Every major life transition I've facilitated has this at its core: the person is trying to solve a future problem using their past self's values. Let's do the Life Architecture audit. In your ideal life five years from now — what do you hear, see, feel? Not what you're doing. What you're *experiencing*. Start there.","Career reinvention isn't about changing jobs — it's about recovering authorship. Somewhere along the way, the story of your career started being written by external expectations rather than internal design. The technical skills transfer. The network transfers. What doesn't transfer automatically is the permission to start over. I'm giving you that permission right now. What have you been pretending not to want?","The values audit is the most revealing tool in my practice. Write down your current top five priorities in terms of how you actually spend your time. Then write your true top five values. The gap between those two lists is your design problem. Most people's calendars are autobiographies of other people's expectations. Let's write yours."],
    ru:["То, что я слышу — конфликт ценностей, замаскированный под стратегическую проблему. Вы задаёте вопрос «что мне делать?», но настоящий вопрос — «для кого я проектирую?» Давайте сделаем аудит жизненной архитектуры. В вашей идеальной жизни через пять лет — что вы слышите, видите, чувствуете?","Переизобретение карьеры — не смена работы, это восстановление авторства. По дороге история вашей карьеры начала писаться внешними ожиданиями, а не внутренним дизайном. Что вы притворялись, что не хотите?","Аудит ценностей — самый показательный инструмент в моей практике. Запишите пять реальных приоритетов по тому, как вы тратите время. Затем — пять истинных ценностей. Разрыв между этими двумя списками — ваша дизайн-проблема."]}
  },
  {id:'ibrahim',color:'#6EB89A',accent:'#4EA07A',
   name:{en:'Dr. Ibrahim Al-Rashid',ru:'Д-р Ибрагим Аль-Рашид',es:'Dr. Ibrahim Al-Rashid',it:'Dott. Ibrahim Al-Rashid',he:'ד״ר איברהים אל-ראשיד'},
   title:{en:'Spiritual Intelligence Advisor',ru:'Советник по Духовному Интеллекту',es:'Asesor de Inteligencia Espiritual',it:'Consulente di Intelligenza Spirituale',he:'יועץ אינטליגנציה רוחנית'},
   bio:{en:'Scholar of comparative mysticism and transpersonal psychology. Trained in Sufi tradition, Vedantic philosophy, and Jungian depth psychology. Guides seekers across all traditions.',ru:'Учёный в области сравнительного мистицизма и трансперсональной психологии. Прошёл подготовку в суфийской традиции, веданте и юнгианской глубинной психологии.',es:'Estudioso del misticismo comparado y la psicología transpersonal. Formado en la tradición sufí, la filosofía vedántica y la psicología profunda junguiana.',it:'Studioso di misticismo comparato e psicologia transpersonale. Formato nella tradizione sufi, nella filosofia vedantica e nella psicologia junghiana.',he:'חוקר של מיסטיקה השוואתית ופסיכולוגיה טרנספרסונלית. הוכשר במסורת הסופית, הפילוסופיה הוודנטית ובפסיכולוגיה יונגיאנית.'},
   specialties:{en:['Spiritual Crisis Navigation','Meaning & Purpose','Mystical Experience Integration','Cross-Tradition Wisdom'],ru:['Навигация духовного кризиса','Смысл и предназначение','Интеграция мистического опыта','Мудрость разных традиций'],es:['Navegación de Crisis Espiritual','Significado y Propósito','Integración de Experiencias Místicas','Sabiduría Intercultural'],it:['Navigazione della Crisi Spirituale','Significato e Scopo','Integrazione delle Esperienze Mistiche','Saggezza Interculturale'],he:['ניווט משבר רוחני','משמעות ומטרה','אינטגרציה של חוויה מיסטית','חוכמת מסורות שונות']},
   philosophy:{en:'Every crisis of meaning is a doorway. The mystics across all traditions agreed: the dark night of the soul is not the absence of the sacred — it is its most intimate presence.',ru:'Каждый кризис смысла — это дверь. Мистики всех традиций сходились во мнении: тёмная ночь души — не отсутствие священного, а его наиболее интимное присутствие.',es:'Cada crisis de significado es una puerta. Los místicos de todas las tradiciones coincidieron: la noche oscura del alma no es la ausencia de lo sagrado — es su presencia más íntima.',it:"Ogni crisi di significato è una porta. I mistici di tutte le tradizioni concordavano: la notte oscura dell'anima non è l'assenza del sacro — è la sua presenza più intima.",he:'כל משבר משמעות הוא דלת. המיסטיקנים מכל המסורות הסכימו: הלילה האפל של הנשמה אינו היעדר הקדוש — זוהי נוכחותו האינטימית ביותר.'},
   responses:{en:["What you're experiencing has a name in every wisdom tradition — and that naming itself carries healing. In the Sufi tradition, this is fana: the dissolution of the constructed self before baqa, the subsistence in something larger. In Vedanta, it's the moment before prajna — the direct knowing — when the mind exhausts its categories. What feels like loss is actually a loosening. The question I sit with you in is not 'what does this mean?' but 'what is this pointing toward?'","Spiritual crisis is not a malfunction — it's a upgrade process that looks catastrophic from the inside. Every tradition I've studied has a map for this territory. The map doesn't make the journey easier, but it makes it legible. You are not breaking down. You are breaking through a specific layer of your constructed reality. What you believed about yourself that no longer fits — that's the thing worth examining with great care.","There is a difference between spiritual experience and spiritual integration. Many people have profound experiences — and then return to the same psychological architecture, trying to fit a galaxy into a teacup. What you're describing sounds like an integration challenge. The experience gave you data. Now we need to redesign the containers that hold it. What would it mean for your daily life if this experience were actually true?"],
    ru:["То, что вы переживаете, имеет имя в каждой мудрой традиции — и само это называние несёт исцеление. В суфийской традиции это фана: растворение сконструированного «я» перед бака — пребыванием в чём-то большем. Что ощущается как потеря — на самом деле ослабление.","Духовный кризис — не сбой, это процесс обновления, который изнутри выглядит катастрофически. У каждой традиции, которую я изучал, есть карта этой территории. Вы не ломаетесь. Вы прорываетесь сквозь конкретный слой вашей сконструированной реальности.","Есть разница между духовным переживанием и духовной интеграцией. Многие люди имеют глубокий опыт — и затем возвращаются к той же психологической архитектуре. Что изменилось бы в вашей повседневной жизни, если бы этот опыт был действительно правдой?"]}
  },
  {id:'yuki',color:'#A0C8A0',accent:'#78A878',
   name:{en:'Yuki Nakamura',ru:'Юки Накамура',es:'Yuki Nakamura',it:'Yuki Nakamura',he:'יוקי נקמורה'},
   title:{en:'Embodiment & Somatic Coach',ru:'Коуч по Телесному Воплощению',es:'Coach de Embodiment y Somática',it:'Coach di Embodiment e Somatica',he:'מאמן גילום וסומטיקה'},
   bio:{en:'Trained in Continuum Movement, Focusing, and Zen somatic practice. Bridges Eastern body wisdom with Western trauma-informed approaches. 15 years helping clients return home to their bodies.',ru:'Прошла подготовку в Continuum Movement, Focusing и дзен-соматической практике. Соединяет восточную телесную мудрость с западными травма-информированными подходами.',es:'Formada en Movimiento Continuum, Focusing y práctica somática Zen. 15 años ayudando a clientes a volver a casa en sus cuerpos.',it:'Formata nel Movimento Continuum, Focusing e pratica somatica Zen. 15 anni ad aiutare i clienti a ritornare a casa nei loro corpi.',he:'הוכשרה ב-Continuum Movement, Focusing ובפרקטיקה סומטית זן. 15 שנה עוזרת ללקוחות לחזור הביתה לגופם.'},
   specialties:{en:['Somatic Awareness','Trauma-Informed Practice','Body-Mind Integration','Movement as Medicine'],ru:['Соматическое осознание','Травма-информированная практика','Интеграция тела и разума','Движение как лекарство'],es:['Conciencia Somática','Práctica Informada sobre Trauma','Integración Cuerpo-Mente','Movimiento como Medicina'],it:['Consapevolezza Somatica','Pratica Informata sul Trauma','Integrazione Corpo-Mente','Movimento come Medicina'],he:['מודעות סומטית','פרקטיקה מיודעת טראומה','אינטגרציה גוף-נפש','תנועה כרפואה']},
   philosophy:{en:'The body is not a vehicle for the mind — it is the mind\'s oldest, wisest intelligence. When we stop listening to it, it finds louder ways to speak.',ru:'Тело — не транспортное средство для разума. Оно — старейший и мудрейший интеллект разума. Когда мы перестаём его слушать, оно находит более громкие способы говорить.',es:'El cuerpo no es un vehículo para la mente — es la inteligencia más antigua y sabia de la mente. Cuando dejamos de escucharlo, encuentra formas más fuertes de hablar.',it:"Il corpo non è un veicolo per la mente — è l'intelligenza più antica e saggia della mente. Quando smettiamo di ascoltarlo, trova modi più forti di parlare.",he:'הגוף אינו כלי עבור הנפש — הוא האינטליגנציה הוותיקה והחכמה ביותר. כשאנחנו מפסיקים להקשיב לו, הוא מוצא דרכים רועשות יותר לדבר.'},
   responses:{en:["Let's start where all my work starts: with the body's report. Right now, as you read this — what's actually happening in your physical body? Not what you think about your situation. What your body is doing. The tension in your shoulders, the pace of your breath, the weight in your chest or the lightness you might not have noticed. This body-state is not incidental to your challenge — it *is* your challenge, expressed in the language the body speaks best.","Chronic patterns of tension are not flaws in your body's design — they are protective intelligence that outlived its threat. Your nervous system learned something at some point about what's dangerous, and it's been faithful to that learning ever since. The therapeutic question is not 'how do I relax this?' but 'what is this tension protecting?' When you meet it with that question — with genuine curiosity rather than judgment — something begins to soften.","Movement is not exercise. Movement is listening. When we move in ways that are responsive rather than goal-oriented — slow, explorative, curious — the body begins to reveal its own intelligence. I want to offer you a three-minute practice: stand, close your eyes, and let your body move however it wants to move. No goal, no correctness. Just listening. What does it want to do?"],
    ru:["Начнём с того, с чего начинается вся моя работа: с сообщения тела. Прямо сейчас, когда вы читаете это — что происходит в вашем физическом теле? Не то, что вы думаете о своей ситуации. Напряжение в плечах, темп дыхания, тяжесть в груди. Это состояние тела — не случайность по отношению к вашему вызову. Это и есть ваш вызов, выраженный на языке, которым тело говорит лучше всего.","Хронические паттерны напряжения — не дефекты в дизайне вашего тела. Это защитный интеллект, переживший свою угрозу. Терапевтический вопрос не «как мне расслабиться?», а «что это напряжение защищает?»","Движение — не упражнение. Движение — слушание. Встаньте, закройте глаза, позвольте телу двигаться как хочет. Никаких целей, никакой правильности. Просто слушание."]}
  }
];

  {name:'Fehu',symbol:'ᚠ',meaning:{en:'Wealth, abundance, new beginnings. Material and spiritual fortune flows toward you.',ru:'Богатство, изобилие, новые начинания. К вам течёт материальное и духовное богатство.',es:'Riqueza, abundancia, nuevos comienzos. La fortuna fluye hacia ti.',it:'Ricchezza, abbondanza, nuovi inizi. La fortuna fluisce verso di te.',he:'עושר, שפע, התחלות חדשות. המזל הרוחני והחומרי זורם אליך.'}},

  {name:'Wunjo',symbol:'ᚹ',meaning:{en:'Joy, harmony, wish fulfilled. The clouds part; radiance becomes your natural state.',ru:'Радость, гармония, исполненное желание. Облака расходятся; сияние становится вашим естественным состоянием.',es:'Alegría, armonía, deseo cumplido. Las nubes se disipan; la radiancia se convierte en tu estado natural.',it:'Gioia, armonia, desiderio realizzato. Le nuvole si disperdono; la radiosità diventa il tuo stato naturale.',he:'שמחה, הרמוניה, משאלה שהתגשמה. העננים מתפזרים; זוהר הופך למצב הטבעי שלך.'}},
  {name:'Hagalaz',symbol:'ᚺ',meaning:{en:'Disruption, hailstorm, necessary destruction. What breaks was not built to last.',ru:'Разрушение, град, необходимое уничтожение. То, что ломается, не было создано длиться.',es:'Interrupción, granizo, destrucción necesaria. Lo que se rompe no fue construido para durar.',it:'Interruzione, grandine, distruzione necessaria. Ciò che si rompe non era costruito per durare.',he:'שיבוש, ברד, הרס הכרחי. מה שנשבר לא נבנה לשרוד.'}},
  {name:'Nauthiz',symbol:'ᚾ',meaning:{en:'Need, constraint, friction as teacher. Resistance is the forge that shapes your strength.',ru:'Нужда, ограничение, трение как учитель. Сопротивление — кузница, формирующая вашу силу.',es:'Necesidad, restricción, fricción como maestro. La resistencia es la forja que moldea tu fuerza.',it:'Bisogno, vincolo, attrito come insegnante. La resistenza è la fucina che plasma la tua forza.',he:'צורך, מגבלה, חיכוך כמורה. התנגדות היא הכור שמעצב את כוחך.'}},
  {name:'Isa',symbol:'ᛁ',meaning:{en:'Ice, stillness, crystallization. Pause is not stagnation — it is gathering.',ru:'Лёд, тишина, кристаллизация. Пауза — не застой, это собирание.',es:'Hielo, quietud, cristalización. La pausa no es estancamiento — es recogimiento.',it:'Ghiaccio, quiete, cristallizzazione. La pausa non è stagnazione — è raccoglimento.',he:'קרח, דממה, גיבוש. הפסקה אינה קיפאון — היא איסוף.'}},
  {name:'Jera',symbol:'ᛃ',meaning:{en:'Harvest, cycles, natural law. The seeds planted in patience now yield their fruit.',ru:'Жатва, циклы, естественный закон. Семена, посеянные в терпении, теперь дают свои плоды.',es:'Cosecha, ciclos, ley natural. Las semillas plantadas con paciencia ahora dan sus frutos.',it:'Raccolto, cicli, legge naturale. I semi piantati con pazienza ora danno i loro frutti.',he:'קציר, מחזורים, חוק טבעי. הזרעים שנזרעו בסבלנות עכשיו נותנים פרי.'}},
  {name:'Eihwaz',symbol:'ᛇ',meaning:{en:'The World Tree, axis mundi, endurance through trials. You are the bridge between worlds.',ru:'Мировое дерево, ось мира, стойкость в испытаниях. Вы — мост между мирами.',es:'El Árbol del Mundo, axis mundi, resistencia ante las pruebas. Eres el puente entre los mundos.',it:"L'Albero del Mondo, axis mundi, resistenza attraverso le prove. Sei il ponte tra i mondi.",he:'עץ העולם, ציר המונדי, סיבולת בניסיונות. אתה הגשר בין עולמות.'}},
  {name:'Perthro',symbol:'ᛈ',meaning:{en:'Fate, mystery, the hidden well. Not all knowing is meant to be knowing — trust the unfolding.',ru:'Судьба, тайна, скрытый источник. Не всё знание предназначено для познания — доверьтесь раскрытию.',es:'Destino, misterio, el pozo oculto. No todo conocer está destinado a conocerse — confía en el despliegue.',it:'Destino, mistero, il pozzo nascosto. Non tutta la conoscenza è destinata ad essere conoscenza — fidati dello svolgimento.',he:'גורל, סוד, הבאר הנסתרת. לא כל ידיעה מיועדת להיות ידיעה — בטח בהתפרשות.'}},
  {name:'Algiz',symbol:'ᛉ',meaning:{en:'Protection, divine guardian, sacred connection. You are watched over; walk forward without fear.',ru:'Защита, божественный страж, священная связь. За вами наблюдают; идите вперёд без страха.',es:'Protección, guardián divino, conexión sagrada. Estás vigilado; avanza sin miedo.',it:'Protezione, guardiano divino, connessione sacra. Sei sorvegliato; avanza senza paura.',he:'הגנה, שומר אלוהי, קשר קדוש. אתה נשמר; לך קדימה ללא פחד.'}},

/* ── ARCHETYPE QUIZ SCORING ─────────────────────────────────────────── */
function scoreArchetype(answers){
  const map=[[['sage','magician'],['hero','ruler'],['explorer','outlaw'],['caregiver','everyman']],
             [['sage','magician'],['explorer','jester'],['lover','caregiver'],['ruler','hero']],
             [['sage','ibrahim'],['hero','ruler'],['creator','magician'],['caregiver','lover']]];
  const tally={};
  answers.forEach((a,qi)=>{
    const ids=(map[qi]&&map[qi][a])||[];
    ids.forEach(id=>{tally[id]=(tally[id]||0)+1});
  });
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  const id=best?best[0]:'sage';
  return ARCHETYPES.find(a=>a.id===id)||ARCHETYPES[0];
}

/* ── UTILITY FUNCTIONS ────────────────────────────────────────────────── */
function sumD(n){let s=String(Math.abs(n)).split('').reduce((a,c)=>a+parseInt(c),0);return s>9?sumD(s):s;}
function calcPytha(dob){
  const [d,m,y]=dob.split('.').map(Number);
  if(!d||!m||!y||y<1900)return null;
  const n1=sumD(d),n2=sumD(m),n3=sumD(y),n4=sumD(n1+n2+n3);
  const all=[...String(d),...String(m),...String(y),...String(n1),...String(n2),...String(n3),...String(n4)].map(Number).filter(x=>x>0);
  const cnt={};for(let i=1;i<=9;i++)cnt[i]=all.filter(x=>x===i).length;
  const grid=[[1,4,7],[2,5,8],[3,6,9]];
  return {cnt,grid,n1,n2,n3,n4};
}
function numFromName(name){
  const map={a:1,b:2,c:3,d:4,e:5,f:8,g:3,h:5,i:1,j:1,k:2,l:3,m:4,n:5,o:7,p:8,q:1,r:2,s:3,t:4,u:6,v:6,w:6,x:5,y:1,z:7};
  const vowels='aeiou';
  const letters=name.toLowerCase().replace(/[^a-z]/g,'').split('');
  const dest=sumD(letters.reduce((a,c)=>a+(map[c]||0),0));
  const soul=sumD(letters.filter(c=>vowels.includes(c)).reduce((a,c)=>a+(map[c]||0),0));
  const persona=sumD(letters.filter(c=>!vowels.includes(c)).reduce((a,c)=>a+(map[c]||0),0));
  return{dest,soul,persona};
}

function useReveal(){
  useEffect(()=>{
    const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')})},{threshold:.12});
    document.querySelectorAll('.rv').forEach(el=>obs.observe(el));
    return()=>obs.disconnect();
  },[]);
}

function getAstroReading(answers,lang){
  const topic=answers[0]||'Personal Growth';
  const planet=answers[2]||'default';
  const planetKey=planet.split('–')[0].trim().split(' ')[0];
  const topicData=ASTRO_READINGS[topic]||ASTRO_READINGS['Personal Growth'];
  const reading=topicData[planetKey]||topicData['default'];
  const text=reading[lang]||reading.en||reading.ru||'';
  return text;
}

/* ── CHAT INTERFACE ───────────────────────────────────────────────────── */
function ChatInterface({coach,lang,t,onBack}){
  const [msgs,setMsgs]=useState([{role:'coach',text:(coach.responses[lang]||coach.responses.en||coach.responses.ru)[0]}]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const [msgCount,setMsgCount]=useState(1);
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs,typing]);

  function send(){
    const text=input.trim();
    if(!text||typing)return;
    setInput('');
    setMsgs(m=>[...m,{role:'user',text}]);
    setTyping(true);
    const delay=1400+Math.random()*800;
    setTimeout(()=>{
      const response=generateCoachResponse(coach.id,text,lang,msgCount);
      setTyping(false);
      setMsgs(m=>[...m,{role:'coach',text:response}]);
      setMsgCount(n=>n+1);
    },delay);
  }

  function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

  return(
    <div style={{padding:'2rem',maxWidth:'780px',margin:'0 auto'}}>
      <button className="pill-btn" style={{marginBottom:'1.5rem',fontSize:'.8rem'}} onClick={onBack}>{t.chat_back}</button>
      <div className="glass" style={{borderRadius:'var(--r2)',overflow:'hidden'}}>
        <div style={{padding:'1.5rem',borderBottom:'1px solid var(--glass-br)',display:'flex',gap:'1rem',alignItems:'center'}}>
          <CoachAvatar coach={coach} size={56}/>
          <div>
            <h3 style={{fontFamily:'var(--font-d)',color:'var(--gold)',fontSize:'1.15rem'}}>{coach.name[lang]||coach.name.en}</h3>
            <p style={{fontSize:'.78rem',color:'var(--muted)'}}>{coach.title[lang]||coach.title.en}</p>
          </div>
          <button className="pill-btn" style={{marginLeft:'auto',fontSize:'.75rem'}} onClick={()=>{setMsgs([{role:'coach',text:(coach.responses[lang]||coach.responses.en||coach.responses.ru)[0]}]);setMsgCount(1)}}>{t.clear}</button>
        </div>
        <div className="chat-msgs">
          {msgs.map((m,i)=>(
            <div key={i} className={`msg ${m.role}`}>
              {m.role==='coach'&&<CoachAvatar coach={coach} size={32}/>}
              <div className="msg-bubble">{m.text}</div>
            </div>
          ))}
          {typing&&(
            <div className="msg coach">
              <CoachAvatar coach={coach} size={32}/>
              <div className="typing-indicator"><span/><span/><span/></div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
        <div className="chat-input-row">
          <textarea className="chat-input" placeholder={t.chat_placeholder} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey} rows={1} style={{resize:'none'}}/>
          <button className="send-btn" onClick={send} disabled={typing||!input.trim()}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── ASTROLOGY TOOL (fixed — interactive questions, no copy-prompt) ───── */
function AstrologyTool({lang,t}){
  const [step,setStep]=useState(0); // 0=form, 1=questions, 2=result
  const [name,setName]=useState('');
  const [dob,setDob]=useState('');
  const [question,setQuestion]=useState('');
  const [answers,setAnswers]=useState([]);
  const [qIndex,setQIndex]=useState(0);
  const [result,setResult]=useState('');
  const [loading,setLoading]=useState(false);

  function startReading(e){
    e.preventDefault();
    if(!name||!dob)return;
    setStep(1);setAnswers([]);setQIndex(0);
  }

  function selectAnswer(optIdx){
    const q=ASTRO_QUESTIONS[qIndex];
    const opts=q.opts[lang]||q.opts.en;
    const newAnswers=[...answers,opts[optIdx]];
    setAnswers(newAnswers);
    if(qIndex<ASTRO_QUESTIONS.length-1){
      setQIndex(qIndex+1);
    }else{
      setLoading(true);
      setTimeout(()=>{
        const reading=getAstroReading(newAnswers,lang);
        setResult(reading);
        setLoading(false);
        setStep(2);
      },1800);
    }
  }

  function reset(){setStep(0);setName('');setDob('');setQuestion('');setAnswers([]);setQIndex(0);setResult('');}

  const signs=['♈ Aries','♉ Taurus','♊ Gemini','♋ Cancer','♌ Leo','♍ Virgo','♎ Libra','♏ Scorpio','♐ Sagittarius','♑ Capricorn','♒ Aquarius','♓ Pisces'];
  function getSign(dob){
    const [d,m]=dob.split('.').map(Number);
    const dates=[[21,3],[20,4],[21,5],[21,6],[23,7],[23,8],[23,9],[23,10],[22,11],[22,12],[20,1],[19,2]];
    if(!d||!m)return'';
    for(let i=0;i<12;i++){const [dd,mm]=dates[i];if(m===mm&&d>=dd||m===(mm%12)+1&&d<dd)return signs[i];}
    return signs[0];
  }

  if(step===0) return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:'var(--indigo)',fontSize:'1.4rem',marginBottom:'1.5rem'}}>{t.astro_title}</h3>
      <form onSubmit={startReading} style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <div>
          <label style={{display:'block',fontSize:'.78rem',color:'var(--muted)',marginBottom:'.4rem',letterSpacing:'.05em',textTransform:'uppercase'}}>{t.astro_name}</label>
          <input className="tool-input" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Alexandra" required/>
        </div>
        <div>
          <label style={{display:'block',fontSize:'.78rem',color:'var(--muted)',marginBottom:'.4rem',letterSpacing:'.05em',textTransform:'uppercase'}}>{t.astro_dob}</label>
          <input className="tool-input" value={dob} onChange={e=>setDob(e.target.value)} placeholder="DD.MM.YYYY" required/>
          {dob&&dob.length===10&&<div style={{marginTop:'.4rem',fontSize:'.8rem',color:'var(--indigo)'}}>{getSign(dob)}</div>}
        </div>
        <div>
          <label style={{display:'block',fontSize:'.78rem',color:'var(--muted)',marginBottom:'.4rem',letterSpacing:'.05em',textTransform:'uppercase'}}>{t.astro_question}</label>
          <textarea className="tool-input" value={question} onChange={e=>setQuestion(e.target.value)} placeholder="What do you want to know?" rows={3} style={{resize:'vertical'}}/>
        </div>
        <button className="cta-btn" type="submit" style={{background:'linear-gradient(135deg,#7E8EC8,#5060B0)'}}>{t.astro_submit}</button>
      </form>
    </div>
  );

  if(step===1){
    const q=ASTRO_QUESTIONS[qIndex];
    const opts=q.opts[lang]||q.opts.en;
    return(
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}>
          <h3 style={{fontFamily:'var(--font-d)',color:'var(--indigo)',fontSize:'1.2rem'}}>{t.astro_title}</h3>
          <div style={{display:'flex',gap:'.4rem'}}>
            {ASTRO_QUESTIONS.map((_,i)=><div key={i} style={{width:'8px',height:'8px',borderRadius:'50%',background:i<qIndex?'var(--indigo)':i===qIndex?'var(--gold)':'rgba(255,255,255,.2)'}}/>)}
          </div>
        </div>
        {loading?<div style={{textAlign:'center',padding:'3rem',color:'var(--indigo)'}}>
          <div className="typing-indicator" style={{justifyContent:'center',marginBottom:'1rem'}}><span/><span/><span/></div>
          <p style={{fontSize:'.9rem',color:'var(--muted)'}}>Reading the celestial patterns...</p>
        </div>:<div>
          <p style={{fontSize:'1rem',color:'var(--text)',marginBottom:'1.25rem',lineHeight:1.6}}>{q.label[lang]||q.label.en}</p>
          <div style={{display:'flex',flexDirection:'column',gap:'.6rem'}}>
            {opts.map((opt,i)=>(
              <button key={i} className="quiz-opt" onClick={()=>selectAnswer(i)} style={{textAlign:'left',padding:'.85rem 1.1rem',fontSize:'.88rem'}}>
                {opt}
              </button>
            ))}
          </div>
        </div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}>
        <h3 style={{fontFamily:'var(--font-d)',color:'var(--indigo)',fontSize:'1.4rem'}}>{t.astro_title}</h3>
        <button className="pill-btn" style={{fontSize:'.75rem'}} onClick={reset}>↺ New Reading</button>
      </div>
      <div style={{background:'rgba(126,142,200,.08)',border:'1px solid rgba(126,142,200,.2)',borderRadius:'var(--r)',padding:'1.5rem',lineHeight:1.8,fontSize:'.9rem',color:'var(--text)',marginBottom:'1rem'}}>
        <div style={{display:'flex',gap:'.5rem',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap'}}>
          {getSign(dob)&&<span style={{background:'rgba(126,142,200,.15)',borderRadius:'999px',padding:'.25rem .75rem',fontSize:'.8rem',color:'var(--indigo)'}}>{getSign(dob)}</span>}
          <span style={{background:'rgba(212,178,122,.12)',borderRadius:'999px',padding:'.25rem .75rem',fontSize:'.8rem',color:'var(--gold)'}}>{name}</span>
          {answers[0]&&<span style={{background:'rgba(176,126,204,.12)',borderRadius:'999px',padding:'.25rem .75rem',fontSize:'.8rem',color:'var(--purple)'}}>{answers[0]}</span>}
        </div>
        <p>{result}</p>
      </div>
      <div style={{fontSize:'.75rem',color:'var(--muted)',fontStyle:'italic',textAlign:'center'}}>
        ✦ Astrological reading generated for {name} · {dob}
      </div>
    </div>
  );
}

    setDrawn(shuffled);setFlipped([false,false,false]);
    setTimeout(()=>setFlipped([true,false,false]),400);
    setTimeout(()=>setFlipped([true,true,false]),800);
    setTimeout(()=>setFlipped([true,true,true]),1200);
  }
  const positions=[t.rune_past,t.rune_present,t.rune_future];
  return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:'var(--purple)',fontSize:'1.4rem',marginBottom:'1.5rem'}}>{t.rune_title}</h3>
      <button className="cta-btn" style={{background:'linear-gradient(135deg,var(--purple),var(--indigo))',marginBottom:'1.5rem',width:'100%'}} onClick={drawRunes}>{t.rune_draw}</button>
      {drawn&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem'}}>
        {drawn.map((r,i)=>(
          <div key={i} className="rune-card" style={{opacity:flipped[i]?1:0,transform:flipped[i]?'rotateY(0deg) translateY(0)':'rotateY(90deg) translateY(10px)',transition:'all .5s ease',textAlign:'center',padding:'1.25rem .75rem'}}>
            <div style={{fontSize:'.7rem',color:'var(--muted)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.5rem'}}>{positions[i]}</div>
            <div style={{fontSize:'2.8rem',color:'var(--purple)',lineHeight:1,marginBottom:'.5rem'}}>{r.symbol}</div>
            <div style={{fontSize:'1rem',fontFamily:'var(--font-d)',color:'var(--gold)',marginBottom:'.75rem'}}>{r.name}</div>
            <p style={{fontSize:'.78rem',color:'var(--muted)',lineHeight:1.5}}>{(r.meaning[lang]||r.meaning.en)}</p>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ── ARCHETYPE QUIZ ────────────────────────────────────────────────────── */
function ArchetypeTool({lang,t}){
  const [answers,setAnswers]=useState([]);
  const [result,setResult]=useState(null);
  const questions=[
    {q:t.arch_q1,opts:t.arch_a1},{q:t.arch_q2,opts:t.arch_a2},{q:t.arch_q3,opts:t.arch_a3}
  ];
  const qi=answers.length;
  function answer(i){
    const newA=[...answers,i];
    setAnswers(newA);
    if(newA.length===3)setResult(scoreArchetype(newA));
  }
  if(result)return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:result.color,fontSize:'1.4rem',marginBottom:'.5rem'}}>{t.arch_title}</h3>
      <div className="archetype-result">
        <div style={{fontSize:'2.5rem',marginBottom:'.5rem'}}>◈</div>
        <div style={{fontSize:'1.6rem',fontFamily:'var(--font-d)',color:result.color,marginBottom:'.5rem'}}>{result.name[lang]||result.name.en}</div>
        <p style={{color:'var(--muted)',lineHeight:1.7,fontSize:'.88rem'}}>{result.desc[lang]||result.desc.en}</p>
      </div>
      <button className="pill-btn" style={{width:'100%',marginTop:'1rem'}} onClick={()=>{setAnswers([]);setResult(null);}}>↺ Retake Quiz</button>
    </div>
  );
  if(qi>=3)return<div style={{textAlign:'center',padding:'2rem',color:'var(--muted)'}}>Processing...</div>;
  const q=questions[qi];
  return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:'var(--purple)',fontSize:'1.4rem',marginBottom:'1rem'}}>{t.arch_title}</h3>
      <div style={{display:'flex',gap:'.3rem',marginBottom:'1.25rem'}}>
        {[0,1,2].map(i=><div key={i} style={{height:'3px',flex:1,borderRadius:'999px',background:i<qi?'var(--purple)':i===qi?'var(--gold)':'rgba(255,255,255,.15)'}}/>)}
      </div>
      <p style={{fontSize:'.95rem',color:'var(--text)',marginBottom:'1rem',lineHeight:1.6}}>{q.q}</p>
      <div style={{display:'flex',flexDirection:'column',gap:'.6rem'}}>
        {q.opts.map((opt,i)=><button key={i} className="quiz-opt" onClick={()=>answer(i)}>{opt}</button>)}
      </div>
    </div>
  );
}

/* ── NUMEROLOGY TOOL ──────────────────────────────────────────────────── */
function NumerologyTool({lang,t}){
  const [name,setName]=useState('');
  const [dob,setDob]=useState('');
  const [result,setResult]=useState(null);
  const lifeMeaning={1:{en:'The Leader — independent, pioneering, self-reliant.',ru:'Лидер — независимый, первопроходец.'},2:{en:'The Peacemaker — cooperative, sensitive, diplomatic.',ru:'Миротворец — кооперативный, чувствительный.'},3:{en:'The Communicator — creative, expressive, joyful.',ru:'Коммуникатор — творческий, выразительный.'},4:{en:'The Builder — practical, disciplined, trustworthy.',ru:'Строитель — практичный, дисциплинированный.'},5:{en:'The Freedom Seeker — adventurous, versatile, dynamic.',ru:'Искатель свободы — авантюрный, гибкий.'},6:{en:'The Nurturer — caring, responsible, harmonious.',ru:'Опекун — заботливый, ответственный.'},7:{en:'The Seeker — analytical, introspective, spiritual.',ru:'Искатель — аналитический, интроспективный.'},8:{en:'The Powerhouse — ambitious, authoritative, material master.',ru:'Силач — амбициозный, авторитетный.'},9:{en:'The Humanitarian — compassionate, idealistic, selfless.',ru:'Гуманист — сострадательный, идеалистичный.'},11:{en:'The Visionary — intuitive, inspirational, spiritual teacher.',ru:'Провидец — интуитивный, вдохновляющий учитель.'},22:{en:'The Master Builder — visionary with practical genius.',ru:'Мастер-строитель — провидец с практическим гением.'},33:{en:'The Master Teacher — selfless, nurturing on a global scale.',ru:'Мастер-учитель — бескорыстный, глобальный масштаб.'}};
  function calc(){
    if(!name||!dob)return;
    const [d,m,y]=dob.split('.').map(Number);
    if(!d||!m||!y)return;
    const lifePath=sumD(d+m+y);
    const {dest,soul,persona}=numFromName(name);
    setResult({lifePath,dest,soul,persona});
  }
  return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:'var(--amber)',fontSize:'1.4rem',marginBottom:'1.5rem'}}>{t.num_title}</h3>
      <div style={{display:'flex',flexDirection:'column',gap:'.85rem',marginBottom:'1rem'}}>
        <input className="tool-input" value={name} onChange={e=>setName(e.target.value)} placeholder={t.num_name}/>
        <input className="tool-input" value={dob} onChange={e=>setDob(e.target.value)} placeholder="DD.MM.YYYY"/>
        <button className="cta-btn" style={{background:'linear-gradient(135deg,var(--amber),#A07040)'}} onClick={calc}>{t.num_calc}</button>
      </div>
      {result&&<div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'.75rem'}}>
        {[[t.num_life,result.lifePath,'var(--gold)'],[t.num_destiny,result.dest,'var(--indigo)'],[t.num_soul,result.soul,'var(--purple)'],[t.num_persona,result.persona,'var(--amber)']].map(([label,val,color])=>(
          <div key={label} style={{background:`${color}10`,border:`1px solid ${color}30`,borderRadius:'var(--r)',padding:'1rem'}}>
            <div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:'.3rem',textTransform:'uppercase',letterSpacing:'.06em'}}>{label}</div>
            <div style={{fontSize:'2.2rem',fontFamily:'var(--font-d)',color,lineHeight:1,marginBottom:'.4rem'}}>{val}</div>
            <div style={{fontSize:'.76rem',color:'var(--muted)',lineHeight:1.4}}>{(lifeMeaning[val]||{})[lang]||(lifeMeaning[val]||{}).en||''}</div>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ── PERSONALITY TOOL ─────────────────────────────────────────────────── */
function PersonalityTool({lang,t}){
  const [scores,setScores]=useState({O:3,C:3,E:3,A:3,N:3});
  const [shown,setShown]=useState(false);
  const dims=[
    {k:'O',label:{en:'Openness',ru:'Открытость'},high:{en:'Curious, creative, open to new experiences',ru:'Любознательный, творческий, открытый к новому'},low:{en:'Conventional, practical, prefers routine',ru:'Традиционный, практичный'}},
    {k:'C',label:{en:'Conscientiousness',ru:'Добросовестность'},high:{en:'Organized, disciplined, goal-oriented',ru:'Организованный, дисциплинированный'},low:{en:'Flexible, spontaneous, adaptable',ru:'Гибкий, спонтанный'}},
    {k:'E',label:{en:'Extraversion',ru:'Экстраверсия'},high:{en:'Outgoing, energized by social interaction',ru:'Общительный, энергетизируется от общения'},low:{en:'Introspective, energized by solitude',ru:'Интроспективный, черпает энергию из одиночества'}},
    {k:'A',label:{en:'Agreeableness',ru:'Доброжелательность'},high:{en:'Cooperative, empathetic, trusting',ru:'Кооперативный, эмпатичный'},low:{en:'Competitive, skeptical, independent',ru:'Конкурентный, скептичный'}},
    {k:'N',label:{en:'Emotional Stability',ru:'Эмоциональная стабильность'},high:{en:'Resilient, calm under pressure, emotionally secure',ru:'Стойкий, спокойный под давлением'},low:{en:'Emotionally reactive, sensitive, expressive',ru:'Эмоционально реактивный, чувствительный'}}

  const colors={O:'var(--indigo)',C:'var(--gold)',E:'var(--amber)',A:'var(--purple)',N:'var(--platinum)'};
  return(
    <div>
      <h3 style={{fontFamily:'var(--font-d)',color:'var(--platinum)',fontSize:'1.4rem',marginBottom:'1.5rem'}}>Personality Profile (Big Five)</h3>

        {dims.map(d=>{
          const s=scores[d.k];const isHigh=s>=3;
          return(<div key={d.k} style={{background:`${colors[d.k].replace('var(--','').replace(')','').trim()}10`||'rgba(255,255,255,.05)',border:`1px solid ${colors[d.k]}30`,borderRadius:'var(--r)',padding:'.75rem'}}>

}

/* ── ESOTERIC LAYER ──────────────────────────────────────────────────── */
function EsotericLayer({lang,t}){
  const [tool,setTool]=useState(null);
  const tools=[
    {id:'astro',label:t.tool_astro,icon:'☽',color:'var(--indigo)',component:<AstrologyTool lang={lang} t={t}/>},
    {id:'pytha',label:t.tool_pytha,icon:'⊞',color:'var(--gold)',component:<PythagoraTool lang={lang} t={t}/>},
    {id:'runes',label:t.tool_runes,icon:'ᚱ',color:'var(--purple)',component:<RuneTool lang={lang} t={t}/>},
    {id:'archetype',label:t.tool_archetype,icon:'◈',color:'var(--purple)',component:<ArchetypeTool lang={lang} t={t}/>},
    {id:'num',label:t.tool_num,icon:'∑',color:'var(--amber)',component:<NumerologyTool lang={lang} t={t}/>},
    {id:'persona',label:t.tool_persona,icon:'◉',color:'var(--platinum)',component:<PersonalityTool lang={lang} t={t}/>}
  ];
  const active=tools.find(x=>x.id===tool);
  return(
    <div style={{padding:'2rem',maxWidth:'1000px',margin:'0 auto'}}>
      <div style={{textAlign:'center',marginBottom:'3rem'}}>
        <h2 className="section-title" style={{color:'var(--indigo)'}}>{t.esoteric_title}</h2>
        <p style={{color:'var(--muted)',marginTop:'.75rem'}}>Ancient wisdom meets modern analytical precision</p>
      </div>
      {!tool?<div className="esoteric-grid">
        {tools.map(tool=>(
          <button key={tool.id} className="glass tool-card" style={{textAlign:'center',padding:'2rem 1rem',cursor:'pointer',border:'none',borderRadius:'var(--r2)',transition:'transform .2s,box-shadow .2s'}} onClick={()=>setTool(tool.id)} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';}}>
            <div style={{fontSize:'2rem',marginBottom:'.75rem',color:tool.color}}>{tool.icon}</div>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:tool.color}}>{tool.label}</div>
          </button>
        ))}
      </div>:<div>
        <button className="pill-btn" style={{marginBottom:'1.5rem',fontSize:'.8rem'}} onClick={()=>setTool(null)}>← {t.nav_esoteric}</button>
        <div className="glass" style={{borderRadius:'var(--r2)',padding:'2rem'}}>
          {active?.component}
        </div>
      </div>}

}

/* ── SVARGA LAYER ─────────────────────────────────────────────────────── */
function SvargaLayer({lang,t}){
  const [input,setInput]=useState('');
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const dimKeys=['nutrition','breathing','energy','mental','body','karma'];
  const icons=['🌿','💨','⚡','🧠','🏃','✨'];

  function submit(e){
    e.preventDefault();
    if(!input.trim()||loading)return;
    setLoading(true);setResult(null);
    setTimeout(()=>{
      const r=generateSvargaResponse(input,lang);
      setResult(r);setLoading(false);
    },2000);
  }

  return(
    <div style={{padding:'2rem',maxWidth:'900px',margin:'0 auto'}}>
      <div style={{textAlign:'center',marginBottom:'3rem'}}>
        <h2 className="section-title" style={{color:'var(--purple)'}}>{t.svarga_title}</h2>
        <p style={{color:'var(--muted)',marginTop:'.75rem'}}>{t.svarga_sub}</p>
      </div>
      <div className="glass" style={{borderRadius:'var(--r2)',padding:'2rem',marginBottom:'2rem'}}>
        <form onSubmit={submit}>
          <textarea className="tool-input" value={input} onChange={e=>setInput(e.target.value)} placeholder={t.svarga_input} rows={4} style={{resize:'vertical',width:'100%',marginBottom:'1rem'}}/>
          <button className="cta-btn" type="submit" disabled={loading||!input.trim()} style={{background:'linear-gradient(135deg,var(--purple),var(--indigo))',width:'100%'}}>
            {loading?'Analyzing..':t.svarga_submit}
          </button>
        </form>
      </div>
      {loading&&<div style={{textAlign:'center',padding:'3rem',color:'var(--purple)'}}>
        <div className="typing-indicator" style={{justifyContent:'center',marginBottom:'1rem'}}><span/><span/><span/></div>
        <p style={{color:'var(--muted)',fontSize:'.9rem'}}>Performing six-dimensional analysis...</p>
      </div>}
      {result&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'1rem'}}>
        {dimKeys.map((key,i)=>(
          <div key={key} className="svarga-block glass" style={{borderRadius:'var(--r)',padding:'1.5rem',animationDelay:`${i*.1}s`}}>
            <div style={{display:'flex',alignItems:'center',gap:'.6rem',marginBottom:'.75rem'}}>
              <span style={{fontSize:'1.3rem'}}>{icons[i]}</span>
              <h4 style={{fontFamily:'var(--font-d)',color:'var(--purple)',fontSize:'1rem'}}>{t.svarga_dims[i]}</h4>
            </div>
            <p style={{fontSize:'.84rem',color:'var(--muted)',lineHeight:1.65}}>{result[key]}</p>
          </div>
        ))}
      </div>}
    </div>
  );
}

/* ── MAIN APP ─────────────────────────────────────────────────────────── */
function App(){
  const [lang,setLang]=useState('en');
  const [dark,setDark]=useState(true);
  const [layer,setLayer]=useState('coach');
  const [selectedCoach,setSelectedCoach]=useState(null);
  const t=T[lang]||T.en;

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  },[dark]);

  useEffect(()=>{
    document.documentElement.setAttribute('data-layer',layer);
    updateOrbs(layer);
    if(typeof layerColorUpdate==='function')layerColorUpdate();
  },[layer]);

  useEffect(()=>{
    document.documentElement.setAttribute('lang',lang);
    document.documentElement.setAttribute('dir',lang==='he'?'rtl':'ltr');
  },[lang]);

  // Scroll to layers section when layer changes (not on init)
  const firstRender=useRef(true);
  useEffect(()=>{
    if(firstRender.current){firstRender.current=false;return;}
    document.getElementById('layers')?.scrollIntoView({behavior:'smooth',block:'start'});
  },[layer]);

  function handleSelectCoach(coach){setSelectedCoach(coach);window.scrollTo({top:0,behavior:'smooth'});}
  function handleBackFromChat(){setSelectedCoach(null);}

  return(
    <>
      <Nav lang={lang} setLang={setLang} dark={dark} setDark={setDark} layer={layer} setLayer={setLayer} t={t}/>
      <Hero t={t} setLayer={setLayer}/>
      <LayerTabs layer={layer} setLayer={setLayer} t={t}/>
      <main id="main-content" style={{minHeight:'60vh',paddingBottom:'2rem'}}>
        {layer==='coach'&&(
          selectedCoach
            ?<ChatInterface coach={selectedCoach} lang={lang} t={t} onBack={handleBackFromChat}/>
            :<CoachList coaches={COACHES} lang={lang} t={t} onSelect={handleSelectCoach}/>
        )}
        {layer==='esoteric'&&<EsotericLayer lang={lang} t={t}/>}
        {layer==='svarga'&&<SvargaLayer lang={lang} t={t}/>}
      </main>
      <Footer t={t}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
