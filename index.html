    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME TOKENS ── */
    :root {
      --bg:           #0D1018;
      --bg-alt:       #131820;
      --surface:      #171D28;
      --surface-2:    #1D2433;
      --text-1:       #EDE9E2;
      --text-2:       #A8A49C;
      --text-3:       #6B6762;
      --border:       rgba(237,233,226,.10);
      --border-md:    rgba(237,233,226,.18);
      --gold:         #C8A86E;
      --gold-hover:   #DDBB7E;
      --gold-dim:     #9A7E4A;
      --gold-faint:   rgba(200,168,110,.12);
      --sage:         #6EA080;
      --shadow:       rgba(0,0,0,.55);
      --nav-bg:       rgba(13,16,24,.93);
      --about-bg:     #F5F1E8;
      --about-text:   #1C1810;
      --about-text2:  #5A5650;
      --about-sage:   #4E7E64;
      --input-bg:     rgba(237,233,226,.055);
      --input-border: rgba(237,233,226,.14);
      --input-focus:  rgba(200,168,110,.45);
      --font-d: 'Cormorant Garamond', Georgia, serif;
      --font-b: 'DM Sans', system-ui, sans-serif;
      --r: 3px;
    }
    [data-theme="light"] {
      --bg:           #F8F5EE;
      --bg-alt:       #F0EDE6;
      --surface:      #FFFFFF;
      --surface-2:    #EDE9E0;
      --text-1:       #1C1810;
      --text-2:       #5A5650;
      --text-3:       #9A9590;
      --border:       rgba(28,24,16,.10);
      --border-md:    rgba(28,24,16,.20);
      --gold:         #9A6E28;
      --gold-hover:   #7E5818;
      --gold-dim:     #BF9040;
      --gold-faint:   rgba(154,110,40,.10);
      --sage:         #3A7556;
      --shadow:       rgba(0,0,0,.10);
      --nav-bg:       rgba(248,245,238,.95);
      --about-bg:     #FFFFFF;
      --about-text:   #1C1810;
      --about-text2:  #5A5650;
      --about-sage:   #3A7556;
      --input-bg:     rgba(28,24,16,.04);
      --input-border: rgba(28,24,16,.16);
      --input-focus:  rgba(154,110,40,.40);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text-1);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
    ::selection { background: rgba(200,168,110,.22); }
    img { display: block; max-width: 100%; }
    a { color: inherit; }

    /* ── LAYOUT ── */
    .sp { padding: clamp(72px,10vw,140px) clamp(24px,7.5vw,112px); }
    .mw { max-width: 1280px; margin: 0 auto; }

    /* ── SCROLL REVEAL ── */
    .rv  { opacity:0; transform:translateY(22px); transition:opacity .85s cubic-bezier(.2,0,.2,1),transform .85s cubic-bezier(.2,0,.2,1); }
    .rvl { opacity:0; transform:translateX(-22px);transition:opacity .85s cubic-bezier(.2,0,.2,1),transform .85s cubic-bezier(.2,0,.2,1); }
    .rvr { opacity:0; transform:translateX(22px); transition:opacity .85s cubic-bezier(.2,0,.2,1),transform .85s cubic-bezier(.2,0,.2,1); }
    .rv.in,.rvl.in,.rvr.in { opacity:1; transform:none; }
    .d1{transition-delay:.10s}.d2{transition-delay:.20s}.d3{transition-delay:.30s}
    .d4{transition-delay:.42s}.d5{transition-delay:.54s}.d6{transition-delay:.66s}.d7{transition-delay:.78s}

    /* ── TYPOGRAPHY ── */
    .eyebrow {
      font-family: var(--font-b); font-size:.68rem; font-weight:500;
      letter-spacing:.22em; text-transform:uppercase; color:var(--gold);
    }
    .eyebrow-sage { color:var(--sage); }
    .gline { flex-shrink:0; width:40px; height:1px; background:linear-gradient(90deg,var(--gold),transparent); opacity:.65; }
    .gline-r { background:linear-gradient(270deg,var(--gold),transparent); }

    /* ── BUTTONS ── */
    .btn-p {
      display:inline-flex; align-items:center; gap:10px;
      padding:15px 38px; background:var(--gold); color:#0D1018;
      font-family:var(--font-b); font-size:.78rem; font-weight:500;
      letter-spacing:.13em; text-transform:uppercase;
      border:none; border-radius:var(--r); cursor:pointer; text-decoration:none;
      transition:background .3s,transform .25s,box-shadow .3s;
    }
    .btn-p:hover { background:var(--gold-hover); transform:translateY(-2px); box-shadow:0 16px 48px rgba(200,168,110,.28); }
    .btn-g {
      display:inline-flex; align-items:center; gap:10px;
      padding:14px 36px; background:transparent; color:var(--text-2);
      font-family:var(--font-b); font-size:.78rem; font-weight:400;
      letter-spacing:.09em; text-transform:uppercase;
      border:1px solid var(--border-md); border-radius:var(--r);
      cursor:pointer; text-decoration:none;
      transition:border-color .3s,color .3s;
    }
    .btn-g:hover { border-color:var(--gold); color:var(--gold); }

    /* ── NAV ── */
    nav.scrolled {
      background:var(--nav-bg) !important;
      backdrop-filter:blur(24px) !important;
      -webkit-backdrop-filter:blur(24px) !important;
      border-bottom:1px solid var(--border) !important;
    }

    /* ── CARDS ── */
    .glass {
      background:var(--gold-faint);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--border); border-radius:var(--r);
    }
    .pc { transition:transform .3s,border-color .3s,background .3s; cursor:pointer; }
    .pc:hover { transform:translateY(-5px); border-color:rgba(200,168,110,.28)!important; background:var(--gold-faint)!important; }
    .tc { transition:none; }
    .prog-b { border-left:2px solid var(--border-md); transition:border-color .3s,background .3s; cursor:pointer; }
    .prog-b:hover { border-left-color:var(--gold); }
    .sdrop-btn { background:none; border:none; cursor:pointer; padding:0; }

    /* ── FORM ── */
    .field {
      width:100%; padding:13px 16px;
      background:var(--input-bg); color:var(--text-1);
      border:1px solid var(--input-border); border-radius:var(--r);
      font-family:var(--font-b); font-size:.9rem; font-weight:300;
      transition:border-color .2s,box-shadow .2s;
      outline:none;
    }
    .field::placeholder { color:var(--text-3); }
    .field:focus { border-color:var(--gold); box-shadow:0 0 0 3px var(--input-focus); }
    .field-error { border-color:#E05050 !important; }
    label { display:block; font-size:.72rem; font-weight:500; letter-spacing:.08em; color:var(--text-3); text-transform:uppercase; margin-bottom:7px; }
    .err-msg { font-size:.72rem; color:#E07070; margin-top:5px; }

    /* ── MOBILE DRAWER ── */
    .drawer-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(13,16,24,.98);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      display:flex; flex-direction:column;
      padding:88px 36px 48px;
      opacity:0; pointer-events:none;
      transition:opacity .35s cubic-bezier(.2,0,.2,1);
    }
    .drawer-overlay.open { opacity:1; pointer-events:all; }
    [data-theme="light"] .drawer-overlay { background:rgba(248,245,238,.98); }

    /* ── ANIMATIONS ── */
    @keyframes glow-pulse {
      0%,100% { box-shadow:0 0 28px rgba(200,168,110,.18); }
      50%      { box-shadow:0 0 56px rgba(200,168,110,.42); }
    }
    .glow { animation:glow-pulse 3.2s ease-in-out infinite; }

    @keyframes scroll-drop {
      0%,100% { transform:translateY(0); opacity:.4; }
      50%      { transform:translateY(8px); opacity:.9; }
    }
    .sdrop { animation:scroll-drop 2.4s ease-in-out infinite; }

    @keyframes hfade {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:none; }
    }
    .hl1{animation:hfade 1s cubic-bezier(.2,0,.2,1) .3s both}
    .hl2{animation:hfade 1s cubic-bezier(.2,0,.2,1) .5s both}
    .hl3{animation:hfade 1s cubic-bezier(.2,0,.2,1) .7s both}
    .hl4{animation:hfade 1s cubic-bezier(.2,0,.2,1) .9s both}
    .hl5{animation:hfade 1s cubic-bezier(.2,0,.2,1) 1.1s both}

    /* ── WHATSAPP FLOAT ── */
    .wa-float {
      position:fixed; bottom:28px; right:28px; z-index:150;
      width:58px; height:58px; border-radius:50%;
      background:#25D366; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 32px rgba(37,211,102,.35);
      transition:transform .25s,box-shadow .25s;
      text-decoration:none;
    }
    .wa-float:hover { transform:scale(1.08) translateY(-2px); box-shadow:0 12px 40px rgba(37,211,102,.48); }
    [dir="rtl"] .wa-float { right:auto; left:28px; }

    /* ── THEME TOGGLE ── */
    .theme-btn {
      background:none; border:1px solid var(--border-md);
      border-radius:20px; padding:7px 13px;
      cursor:pointer; display:flex; align-items:center; gap:7px;
      font-family:var(--font-b); font-size:.68rem; font-weight:500;
      letter-spacing:.08em; color:var(--text-3);
      transition:border-color .2s,color .2s;
    }
    .theme-btn:hover { border-color:var(--gold); color:var(--gold); }

    /* ── LANG DROPDOWN ── */
    .lang-wrap { position:relative; }
    .lang-btn {
      background:none; border:1px solid var(--border-md);
      border-radius:var(--r); padding:7px 12px;
      cursor:pointer; display:flex; align-items:center; gap:5px;
      font-family:var(--font-b); font-size:.68rem; font-weight:500;
      letter-spacing:.12em; color:var(--text-3);
      transition:border-color .2s,color .2s;
    }
    .lang-btn:hover,.lang-btn.open { border-color:var(--gold); color:var(--gold); }
    .lang-drop {
      position:absolute; top:calc(100% + 8px); right:0;
      background:var(--surface); border:1px solid var(--border-md);
      border-radius:var(--r); min-width:120px; overflow:hidden;
      box-shadow:0 16px 48px var(--shadow);
      opacity:0; pointer-events:none; transform:translateY(-6px);
      transition:opacity .2s,transform .2s;
    }
    [dir="rtl"] .lang-drop { right:auto; left:0; }
    .lang-drop.open { opacity:1; pointer-events:all; transform:none; }
    .lang-opt {
      display:block; width:100%; padding:10px 16px; background:none; border:none;
      text-align:left; cursor:pointer; font-family:var(--font-b);
      font-size:.76rem; color:var(--text-2); letter-spacing:.06em;
      transition:background .15s,color .15s;
    }
    [dir="rtl"] .lang-opt { text-align:right; }
    .lang-opt:hover { background:var(--gold-faint); color:var(--gold); }
    .lang-opt.active { color:var(--gold); font-weight:500; }

    /* ── LEGAL MODAL ── */
    .legal-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.65); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; padding:20px;
      animation:fadeIn .25s ease-out;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .legal-card {
      background:var(--surface); border:1px solid var(--border-md); border-radius:6px;
      max-width:720px; width:100%; max-height:85vh; overflow-y:auto;
      padding:clamp(28px,4vw,48px);
      box-shadow:0 30px 80px rgba(0,0,0,.5);
    }
    .legal-card h3 { font-family:var(--font-d); font-size:clamp(22px,3vw,32px); font-weight:400; color:var(--text-1); margin-bottom:18px; letter-spacing:-.01em; }
    .legal-card .body { font-size:.88rem; color:var(--text-2); line-height:1.78; font-weight:300; white-space:pre-wrap; }
    .legal-close {
      background:none; border:1px solid var(--border-md); color:var(--text-2);
      padding:8px 18px; border-radius:var(--r); cursor:pointer;
      font-family:var(--font-b); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase;
      margin-top:24px; transition:border-color .2s,color .2s;
    }
    .legal-close:hover { border-color:var(--gold); color:var(--gold); }
    .legal-link {
      background:none; border:none; cursor:pointer; padding:0;
      font-size:.66rem; color:var(--text-3); letter-spacing:.05em;
      transition:color .2s; font-family:var(--font-b);
    }
    .legal-link:hover { color:var(--gold); }

    /* ── CONTACT CARDS ── */
    .ccard {
      display:flex; flex-direction:column; gap:10px;
      padding:28px 24px; border-radius:var(--r);
      border:1px solid var(--border); background:var(--gold-faint);
      text-decoration:none; transition:transform .25s,border-color .25s,box-shadow .25s;
    }
    .ccard:hover { transform:translateY(-4px); border-color:rgba(200,168,110,.32); box-shadow:0 16px 40px var(--shadow); }

    /* ── RESPONSIVE ── */
    @media(max-width:768px){
      .dsk-hide{display:none!important}
      .mob-center{text-align:center!important;align-items:center!important}
      .mob-col{flex-direction:column!important}
    }
    @media(min-width:769px){
      .mob-only{display:none!important}
    }
  </style>

  function useScrollReveal() {
    React.useEffect(() => {
      const obs = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }),
        { threshold: 0.08 }
      );
      document.querySelectorAll('.rv,.rvl,.rvr').forEach(el => obs.observe(el));
      return () => obs.disconnect();
    }, []);
  }

  function scrollToSectionSection(id) {
    const el = document.getElementById(id);
    if (!el) return;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 72, behavior: 'smooth' });
  }

  // ─────────────────────────────────────────────────────────────
  // PARTICLE CANVAS
  // ─────────────────────────────────────────────────────────────
  function ParticleCanvas() {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const canvas = ref.current;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      const pts = Array.from({ length: 55 }, () => ({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*1.2+0.4,
        vx: (Math.random()-.5)*.22, vy: -(Math.random()*.3+.07),
        o: Math.random()*.4+.12,
      }));
      let raf;
      const draw = () => {
        ctx.clearRect(0,0,w,h);
        for (const p of pts) {
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(200,168,110,${p.o})`; ctx.fill();
          p.x+=p.vx; p.y+=p.vy;
          if (p.y<-4){p.y=h+4;p.x=Math.random()*w;}
          if (p.x<-4) p.x=w+4; if(p.x>w+4) p.x=-4;
        }
        raf=requestAnimationFrame(draw);
      };
      draw();
      const onResize=()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;};
      window.addEventListener('resize',onResize);
      return ()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);};
    },[]);
    return <canvas ref={ref} style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:2}}/>;
  }

  // ─────────────────────────────────────────────────────────────
  // CONTACT
  // ─────────────────────────────────────────────────────────────
  function ContactSection({ lang }) {
    const t = T[lang].contact;
    const ft = t.form;
    const isRTL = lang === 'he';

    const [form, setForm] = React.useState({ name:'', email:'', phone:'', message:'' });
    const [honey, setHoney] = React.useState('');
    const [errors, setErrors] = React.useState({});
    const [status, setStatus] = React.useState('idle'); // idle | sending | ok | err
    const [robot, setRobot] = React.useState(false);
    const [mathAns, setMathAns] = React.useState('');
    // Stable per-mount math challenge
    const math = React.useMemo(() => {
      const a = 2 + Math.floor(Math.random() * 7); // 2..8
      const b = 2 + Math.floor(Math.random() * 7); // 2..8
      return { a, b, sum: a + b };
    }, []);

    const validate = () => {
      const e = {};
      if (!form.name.trim() || form.name.trim().length < 2) e.name = true;
      if (!form.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = true;
      if (!form.message.trim() || form.message.trim().length < 10) e.message = true;
      if (!robot) e.robot = true;
      if (parseInt(mathAns, 10) !== math.sum) e.math = true;
      return e;
    };

    const mailtoHref = React.useMemo(() => {
      const subject = encodeURIComponent('New Lead — Svarga Marathon');
      const body = encodeURIComponent(
        `Name: ${form.name || '—'}\nEmail: ${form.email || '—'}\nPhone: ${form.phone || '—'}\nLanguage: ${lang}\n\nMessage:\n${form.message || '—'}`
      );
      return `mailto:${FORM_EMAIL}?subject=${subject}&body=${body}`;
    }, [form, lang]);

    const handleSubmit = async (e) => {
      e.preventDefault();
      if (honey) return; // honeypot triggered — silently drop
      const errs = validate();
      if (Object.keys(errs).length) { setErrors(errs); return; }
      setErrors({});
      setStatus('sending');

      const payload = {
        name: form.name,
        email: form.email,
        phone: form.phone || '—',
        message: form.message,
        language: lang,
        _subject: 'New Lead — Svarga Marathon',
        _template: 'table',
        _captcha: 'false',
      };

      try {
        const res = await fetch(`https://formsubmit.co/ajax/${FORM_EMAIL}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        const success = data && (data.success === 'true' || data.success === true);
        setStatus(success ? 'ok' : 'err');
      } catch {
        setStatus('err');
      }
    };

    const contactCards = [
      { key:'whatsapp', href:WHATSAPP, icon:<IconWhatsApp size={24} color="var(--gold)"/>, bg:'rgba(37,211,102,.08)', border:'rgba(37,211,102,.22)' },
      { key:'telegram', href:TELEGRAM, icon:<IconTelegram size={22} color="var(--gold)"/>, bg:'rgba(41,182,246,.08)', border:'rgba(41,182,246,.22)' },
      { key:'email',    href:`mailto:${CONTACT_EMAIL}`, icon:(
          <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="var(--gold)" strokeWidth="1.8" strokeLinecap="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        ), bg:'var(--gold-faint)', border:'var(--border-gold)' },
    ];

    return (
      <section id="contact" style={{background:'var(--surface-2)'}}>
        <div className="sp mw" style={{maxWidth:1100}}>
          <div style={{textAlign:'center',marginBottom:'clamp(48px,6vw,72px)'}}>
            <div className="rv" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14,marginBottom:18}}>
              <div className="gline"/><span className="eyebrow">{t.eyebrow}</span><div className="gline gline-r"/>
            </div>
            <h2 className="rv d1" style={{fontFamily:'var(--font-d)',fontSize:'clamp(28px,4.2vw,52px)',fontWeight:400,lineHeight:1.15,letterSpacing:'-.01em',marginBottom:14}}>{t.h2}</h2>
            <p className="rv d2" style={{fontSize:'.92rem',color:'var(--text-2)',fontWeight:300,maxWidth:540,margin:'0 auto'}}>{t.sub}</p>
          </div>

          {/* Contact cards */}
          <div className="rv d2" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,200px),1fr))',gap:16,marginBottom:56}}>
            {contactCards.map(({key,href,icon,bg,border})=>(
              <a key={key} href={href} target="_blank" rel="noopener noreferrer" className="ccard"
                style={{background:bg,borderColor:border}}>
                <div style={{width:40,height:40,borderRadius:'50%',background:'rgba(200,168,110,.10)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {icon}
                </div>
                <div>
                  <div style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',fontWeight:400,marginBottom:3}}>{t.cards[key].title}</div>
                  <div style={{fontSize:'.76rem',color:'var(--text-3)',direction:key==='whatsapp'&&isRTL?'ltr':'inherit'}}>{t.cards[key].sub}</div>
                </div>
                <div style={{fontSize:'.72rem',color:'var(--gold)',letterSpacing:'.06em',marginTop:4}}>
                  {t.cards[key].action} →
                </div>
              </a>
            ))}
          </div>

          {/* Lead form */}
          <div className="rv d3" style={{maxWidth:640,margin:'0 auto'}}>
            {status === 'ok' ? (
              <div style={{textAlign:'center',padding:'48px 24px',border:'1px solid var(--border-md)',borderRadius:4,background:'var(--gold-faint)'}}>
                <div style={{fontSize:'2rem',marginBottom:12}}>✓</div>
                <p style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',color:'var(--text-1)',marginBottom:20}}>{ft.ok}</p>
                <button type="button" className="btn-g" onClick={()=>{setForm({name:'',email:'',phone:'',message:''});setRobot(false);setMathAns('');setErrors({});setStatus('idle');}}
                  style={{fontSize:'.72rem'}}>
                  {ft.submit}
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} noValidate style={{display:'flex',flexDirection:'column',gap:20}}>
                {/* Honeypot — hidden from humans */}
                <input type="text" name="_honey" value={honey} onChange={e=>setHoney(e.target.value)}
                  style={{display:'none'}} tabIndex="-1" autoComplete="off"/>

                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,240px),1fr))',gap:20}}>
                  <div>
                    <label htmlFor="f-name">{ft.name}</label>
                    <input id="f-name" type="text" placeholder={ft.namePh}
                      className={`field${errors.name?' field-error':''}`}
                      value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
                    {errors.name && <div className="err-msg">↑ required</div>}
                  </div>
                  <div>
                    <label htmlFor="f-email">{ft.email}</label>
                    <input id="f-email" type="email" placeholder={ft.emailPh}
                      className={`field${errors.email?' field-error':''}`}
                      value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/>
                    {errors.email && <div className="err-msg">↑ valid email required</div>}
                  </div>
                </div>

                <div>
                  <label htmlFor="f-phone">{ft.phone}</label>
                  <input id="f-phone" type="tel" placeholder={ft.phonePh}
                    className="field" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/>
                </div>

                <div>
                  <label htmlFor="f-msg">{ft.message}</label>
                  <textarea id="f-msg" placeholder={ft.messagePh} rows={5}
                    className={`field${errors.message?' field-error':''}`}
                    value={form.message} onChange={e=>setForm({...form,message:e.target.value})}
                    style={{resize:'vertical',minHeight:120}}/>
                  {errors.message && <div className="err-msg">↑ required (min 10 chars)</div>}
                </div>

                {/* Verification: math + not-a-robot */}
                <div style={{padding:'18px 20px',border:'1px solid var(--border)',borderRadius:'var(--r)',background:'var(--gold-faint)',display:'flex',flexDirection:'column',gap:14}}>
                  <label htmlFor="f-robot" style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',textTransform:'none',letterSpacing:0,fontSize:'.86rem',color:'var(--text-1)',fontWeight:400,marginBottom:0}}>
                    <input id="f-robot" type="checkbox" checked={robot}
                      onChange={e=>setRobot(e.target.checked)}
                      style={{width:18,height:18,accentColor:'var(--gold)',cursor:'pointer',flexShrink:0}}/>
                    <span>{ft.robot}</span>
                  </label>
                  {errors.robot && <div className="err-msg" style={{marginTop:-6}}>↑ {ft.robotErr}</div>}

                  <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                    <span style={{fontSize:'.82rem',color:'var(--text-2)'}}>
                      {ft.verify} <strong style={{color:'var(--gold)'}}>{math.a} + {math.b}</strong> {ft.verifyEq}
                    </span>
                    <input id="f-math" type="text" inputMode="numeric" placeholder={ft.verifyPh}
                      className={`field${errors.math?' field-error':''}`}
                      value={mathAns} onChange={e=>setMathAns(e.target.value.replace(/[^0-9-]/g,''))}
                      style={{width:90,padding:'8px 12px',fontSize:'.86rem'}}
                      autoComplete="off"/>
                  </div>
                  {errors.math && <div className="err-msg" style={{marginTop:-6}}>↑ {ft.verifyErr}</div>}
                </div>

                {status === 'err' && (
                  <div style={{textAlign:'center',padding:'14px 18px',border:'1px solid rgba(224,112,112,.35)',borderRadius:'var(--r)',background:'rgba(224,112,112,.06)'}}>
                    <p style={{fontSize:'.82rem',color:'#E07070',marginBottom:10}}>{ft.err}</p>
                    <a href={mailtoHref}
                      style={{color:'var(--gold)',fontSize:'.78rem',letterSpacing:'.04em',textDecoration:'underline'}}>
                      {ft.mailFallback}
                    </a>
                  </div>
                )}

                <button type="submit" className="btn-p" disabled={status==='sending'}
                  style={{alignSelf:'flex-start',opacity:status==='sending'?.65:1,cursor:status==='sending'?'not-allowed':'pointer'}}>
                  {status==='sending' ? ft.sending : ft.submit}
                </button>
              </form>
            )}
          </div>
        </div>
      </section>
    );
  }

                onMouseEnter={e=>e.currentTarget.style.color='var(--gold)'}
                onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
              >svarga-om.com <IconExternalLink size={10}/></a>
            </div>

            {/* Nav links */}
            <div>
              <div style={{fontSize:'.64rem',color:'var(--text-3)',letterSpacing:'.18em',textTransform:'uppercase',marginBottom:14}}>Menu</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {t.links.map((l,i)=>(
                  <button key={i} onClick={()=>scrollToSectionSection(navIds[i])} style={{
                    background:'none',border:'none',cursor:'pointer',textAlign:'start',
                    fontSize:'.78rem',color:'var(--text-2)',letterSpacing:'.04em',padding:0,
                    transition:'color .2s',
                  }}
                    onMouseEnter={e=>e.currentTarget.style.color='var(--gold)'}
                    onMouseLeave={e=>e.currentTarget.style.color='var(--text-2)'}
                  >{l}</button>
                ))}
              </div>
            </div>

            {/* Social */}
            <div>
              <div style={{fontSize:'.64rem',color:'var(--text-3)',letterSpacing:'.18em',textTransform:'uppercase',marginBottom:14}}>{t.followUs}</div>
              <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                {socials.map(({icon,href,label})=>(
                  <a key={label} href={href} target="_blank" rel="noopener noreferrer" title={label}
                    style={{
                      width:38,height:38,borderRadius:4,background:'var(--gold-faint)',
                      border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',
                      color:'var(--text-2)',textDecoration:'none',transition:'border-color .2s,color .2s,transform .2s',
                    }}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.color='var(--gold)';e.currentTarget.style.transform='translateY(-2px)';}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.color='var(--text-2)';e.currentTarget.style.transform='none';}}
                  >{icon}</a>
                ))}
              </div>
              {/* Digital cards */}
              <div style={{marginTop:20,display:'flex',flexDirection:'column',gap:8}}>
                {[
                  {href:SOCIAL.cardRu, flag:'🇷🇺', label:'Digital Card (RU)'},
                  {href:SOCIAL.cardHe, flag:'🇮🇱', label:'Digital Card (HE)'},
                ].map(({href,flag,label})=>(
                  <a key={label} href={href} target="_blank" rel="noopener noreferrer"
                    style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:'.68rem',color:'var(--text-3)',textDecoration:'none',letterSpacing:'.04em',transition:'color .2s'}}
                    onMouseEnter={e=>e.currentTarget.style.color='var(--gold)'}
                    onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
                  >
                    <IconContactCard size={13}/>
                    <span style={{fontSize:'.8rem',lineHeight:1}}>{flag}</span>
                    {label}
                  </a>
                ))}
              </div>
            </div>
          </div>

          {/* Legal links row */}
          <div style={{borderTop:'1px solid var(--border)',paddingTop:22,marginBottom:18,display:'flex',flexWrap:'wrap',gap:'12px 22px',alignItems:'center'}}>
            <span style={{fontSize:'.6rem',color:'var(--text-3)',letterSpacing:'.18em',textTransform:'uppercase',opacity:.8}}>{t.legalHeader}:</span>
            <button className="legal-link" onClick={()=>setLegalDoc('terms')}>{t.terms}</button>
            <span style={{color:'var(--border-md)'}}>·</span>
            <button className="legal-link" onClick={()=>setLegalDoc('privacy')}>{t.privacy}</button>
            <span style={{color:'var(--border-md)'}}>·</span>
            <button className="legal-link" onClick={()=>setLegalDoc('accessibility')}>{t.accessibility}</button>
          </div>

          {/* Bottom bar */}
          <div style={{paddingTop:14,display:'flex',flexWrap:'wrap',gap:16,alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:'.68rem',color:'var(--text-3)',letterSpacing:'.04em'}}>{t.copy}</span>
            <a href={WHATSAPP} target="_blank" rel="noopener noreferrer"
              style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:'.68rem',color:'var(--text-3)',textDecoration:'none',letterSpacing:'.04em',transition:'color .2s'}}
              onMouseEnter={e=>e.currentTarget.style.color='#25D366'}
              onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}
            >
              <IconWhatsApp size={13} color="currentColor"/> +972 54 998 9627
            </a>
          </div>
        </div>

        {/* Legal modal */}
        {legalDoc && lt && lt[legalDoc] && (
          <div className="legal-overlay" onClick={()=>setLegalDoc(null)} role="dialog" aria-modal="true">
            <div className="legal-card" onClick={e=>e.stopPropagation()}>
              <h3>{lt[legalDoc].title}</h3>
              <div className="body">{lt[legalDoc].body}</div>
              <button className="legal-close" onClick={()=>setLegalDoc(null)}>{lt.close}</button>
            </div>
          </div>
        )}
      </footer>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // WHATSAPP FLOAT
  // ─────────────────────────────────────────────────────────────
  function WhatsAppFloat() {
    return (
      <a href={WHATSAPP} target="_blank" rel="noopener noreferrer" className="wa-float" title="WhatsApp">
        <IconWhatsApp size={28}/>
      </a>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // APP
  // ─────────────────────────────────────────────────────────────
  function App() {
    const [lang, setLang] = React.useState(() => {
      try { return localStorage.getItem('lang') || 'en'; } catch { return 'en'; }
    });
    const [theme, setTheme] = React.useState(() => {
      try { return localStorage.getItem('theme') || 'dark'; } catch { return 'dark'; }
    });

    React.useEffect(() => {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('theme', theme); } catch {}
    }, [theme]);

    React.useEffect(() => {
      const isRTL = lang === 'he';
      document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('lang', lang);
      // Update page title per language
      const titles = { en:'Awaken · Transform — Moshe Om', ru:'Пробудись · Трансформируйся — Моше Ом', he:'התעורר · השתנה — משה אוסטרובסקי', de:'Erwache · Transformiere — Moshe Om' };
      document.title = titles[lang] || titles.en;
      try { localStorage.setItem('lang', lang); } catch {}
    }, [lang]);

    useScrollReveal();

    return (
      <>
        <NavBar lang={lang} setLang={setLang} theme={theme} setTheme={setTheme}/>
        <HeroSection         lang={lang}/>
        <AboutSection        lang={lang}/>
        <PracticesSection    lang={lang}/>
        <ProgramSection      lang={lang}/>
        <TeacherSection      lang={lang}/>
        <TestimonialsSection lang={lang}/>
        <CTASection          lang={lang}/>
        <ContactSection      lang={lang}/>
        <FooterSection       lang={lang}/>
        <WhatsAppFloat/>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
