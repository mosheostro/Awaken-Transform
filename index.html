  ];
  const [answers,setAnswers]=React.useState([]);
  const [result,setResult]=React.useState(null);
  function answer(i){
    const next=[...answers,i];
    setAnswers(next);
    if(next.length===3){
      const idx=scoreArchetype(next);
      setResult(ARCHETYPES[idx]);
    }
  }
  if(result) return(
    <div style={{textAlign:'center'}}>
      <div style={{fontSize:48,marginBottom:12}}>{result.symbol||'✦'}</div>
      <h3 style={{fontFamily:'var(--font-d)',fontSize:22,color:'var(--indigo)',margin:'0 0 12px',fontWeight:400}}>
        {result.name[lang]||result.name.en}
      </h3>
      <p style={{fontFamily:'var(--font-b)',fontSize:13,color:'rgba(200,212,224,.75)',lineHeight:1.7,marginBottom:20}}>
        {result.desc[lang]||result.desc.en}
      </p>
      <button onClick={()=>{setAnswers([]);setResult(null);}}
        style={{background:'rgba(126,142,200,.1)',border:'1px solid rgba(126,142,200,.3)',
          borderRadius:10,padding:'10px 20px',color:'var(--indigo)',cursor:'pointer',
          fontFamily:'var(--font-b)',fontSize:13,fontWeight:600}}>
        ↺ {t.retake}
      </button>
    </div>
  );
  const q=QUESTIONS[answers.length];
  if(!q)return null;
  return(
    <div>
      <div style={{fontSize:11,color:'rgba(200,212,224,.4)',fontFamily:'var(--font-b)',marginBottom:12,textAlign:'center'}}>
        {answers.length+1} / 3
      </div>
      <p style={{fontFamily:'var(--font-b)',fontSize:14,color:'var(--platinum)',marginBottom:16,textAlign:'center',lineHeight:1.6}}>{q.q}</p>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {q.opts.map((o,i)=>(
          <button key={i} onClick={()=>answer(i)}
            style={{background:'rgba(126,142,200,.06)',border:'1px solid rgba(126,142,200,.2)',
              borderRadius:10,padding:'12px 16px',color:'rgba(200,212,224,.8)',
              cursor:'pointer',fontFamily:'var(--font-b)',fontSize:13,textAlign:'left',transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--indigo)';e.currentTarget.style.background='rgba(126,142,200,.12)';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(126,142,200,.2)';e.currentTarget.style.background='rgba(126,142,200,.06)';}}>
            {o}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── NUMEROLOGY TOOL ──────────────────────────────────────────────────────────
function NumerologyTool({lang}){
  const t=T[lang];
  const [name,setName]=React.useState('');
  const [dob,setDob]=React.useState('');
  const [result,setResult]=React.useState(null);
  function compute(){
    if(!name&&!dob)return;
    const life=dob?calcPytha(dob):null;
    const nameN=name?numFromName(name):null;
    setResult({life:life?life.n4:null,name:nameN,zodiac:dob?zodiacSign(dob,lang):null});
  }
  return(
    <div>
      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.num_name_ph||t.astro_name_ph}
          style={{background:'rgba(24,20,14,.6)',border:'1px solid rgba(240,235,224,.12)',
            borderRadius:8,padding:'10px 12px',color:'var(--platinum)',fontFamily:'var(--font-b)',fontSize:13,outline:'none'}}/>
        <input value={dob} onChange={e=>setDob(e.target.value)} placeholder="DD.MM.YYYY"
          style={{background:'rgba(24,20,14,.6)',border:'1px solid rgba(240,235,224,.12)',
            borderRadius:8,padding:'10px 12px',color:'var(--platinum)',fontFamily:'var(--font-b)',fontSize:13,outline:'none'}}/>
      </div>
      <button onClick={compute}
        style={{width:'100%',background:'linear-gradient(135deg,var(--indigo),#5a6db0)',border:'none',
          borderRadius:10,padding:'11px',color:'#fff',cursor:'pointer',fontFamily:'var(--font-b)',fontSize:14,fontWeight:600,marginBottom:16}}>
        {t.calculate}
      </button>
      {result&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {result.life&&<div style={{background:'rgba(126,142,200,.08)',border:'1px solid rgba(126,142,200,.2)',borderRadius:10,padding:'14px',textAlign:'center'}}>
            <div style={{fontSize:10,color:'rgba(200,212,224,.5)',fontFamily:'var(--font-b)',marginBottom:6}}>{t.num_life}</div>
            <div style={{fontSize:28,fontFamily:'var(--font-d)',color:'var(--indigo)',fontWeight:700}}>{result.life}</div>
          </div>}
          {result.name&&<div style={{background:'rgba(126,142,200,.08)',border:'1px solid rgba(126,142,200,.2)',borderRadius:10,padding:'14px',textAlign:'center'}}>
            <div style={{fontSize:10,color:'rgba(200,212,224,.5)',fontFamily:'var(--font-b)',marginBottom:6}}>{t.num_name}</div>
            <div style={{fontSize:28,fontFamily:'var(--font-d)',color:'var(--indigo)',fontWeight:700}}>{result.name}</div>
          </div>}
          {result.zodiac&&<div style={{background:'rgba(126,142,200,.08)',border:'1px solid rgba(126,142,200,.2)',borderRadius:10,padding:'14px',textAlign:'center'}}>
            <div style={{fontSize:10,color:'rgba(200,212,224,.5)',fontFamily:'var(--font-b)',marginBottom:6}}>{t.num_zodiac}</div>
            <div style={{fontSize:18,color:'var(--indigo)',fontFamily:'var(--font-b)',marginTop:4}}>{result.zodiac}</div>
          </div>}
        </div>
      )}
    </div>
  );
}

// ─── PERSONALITY TOOL ─────────────────────────────────────────────────────────
function PersonalityTool({lang}){
  const t=T[lang];
  const [input,setInput]=React.useState('');
  const [result,setResult]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const profiles={
    en:["Your responses reveal a **Visionary-Analyst** pattern: you process the world through structured intuition. You tend to see systems before you see details, and your deepest frustration comes when reality moves slower than your inner model. Your core strength: making the invisible legible. Your growth edge: releasing the need to already know the answer before asking the question.",
        "The profile that emerges is a **Connector-Builder**: someone who draws energy from other people but executes best alone. You have an unusual talent for reading what's unspoken in a room, and this makes you a natural architect of trust. Your challenge: you give so consistently that you sometimes neglect the inventory of your own needs.",
        "Your pattern matches the **Sovereign archetype**: independent, self-directed, and most alive when given complete ownership of a domain. You are not difficult — you are precise. You know what excellence feels like from the inside, and you cannot pretend otherwise. The invitation: bring others into your vision rather than executing it in isolation."],
    ru:["Ваши ответы раскрывают паттерн **Визионера-Аналитика**: вы обрабатываете мир через структурированную интуицию. Вы склонны видеть системы раньше деталей, а ваше глубочайшее разочарование возникает, когда реальность движется медленнее вашей внутренней модели. Ваша сильная сторона: делать невидимое понятным. Ваша точка роста: освободиться от необходимости знать ответ до постановки вопроса.",
        "Профиль, который проявляется, — **Коннектор-Строитель**: кто-то, кто черпает энергию от людей, но лучше всего работает в одиночестве. У вас есть редкий талант читать невысказанное в комнате. Ваш вызов: вы отдаёте настолько последовательно, что иногда пренебрегаете своими собственными потребностями.",
        "Ваш паттерн соответствует архетипу **Суверена**: независимого, самонаправленного, живущего в полную силу, когда ему дано полное владение областью. Вы не сложны — вы точны. Приглашение: привлекайте других к своему видению, а не реализуйте его в изоляции."]
  };
  function analyze(){
    if(!input.trim())return;
    setLoading(true);
    setTimeout(()=>{
      const pool=lang==='ru'?profiles.ru:profiles.en;
      setResult(pick(pool));
      setLoading(false);
    },1400);
  }
  return(
    <div>
      <p style={{fontFamily:'var(--font-b)',fontSize:13,color:'rgba(200,212,224,.6)',marginBottom:12,lineHeight:1.6}}>{t.personality_prompt||t.svarga_intro}</p>
      <textarea value={input} onChange={e=>setInput(e.target.value)} rows={4}
        placeholder={t.personality_ph||t.chat_placeholder}
        style={{width:'100%',background:'rgba(24,20,14,.6)',border:'1px solid rgba(240,235,224,.12)',
          borderRadius:8,padding:'10px 12px',color:'var(--platinum)',fontFamily:'var(--font-b)',
          fontSize:13,outline:'none',resize:'vertical',boxSizing:'border-box',marginBottom:12}}/>
      <button onClick={analyze} disabled={!input.trim()||loading}
        style={{width:'100%',background:input.trim()?'linear-gradient(135deg,var(--indigo),#5a6db0)':'rgba(126,142,200,.2)',
          border:'none',borderRadius:10,padding:'11px',color:input.trim()?'#fff':'rgba(200,212,224,.3)',
          cursor:input.trim()?'pointer':'default',fontFamily:'var(--font-b)',fontSize:14,fontWeight:600,marginBottom:16}}>
        {loading?t.analyzing:t.analyze}
      </button>
      {result&&(
        <div style={{background:'rgba(126,142,200,.07)',border:'1px solid rgba(126,142,200,.2)',borderRadius:12,padding:16}}>
          <p style={{fontFamily:'var(--font-b)',fontSize:13,color:'rgba(200,212,224,.85)',lineHeight:1.8,margin:0}}>{result}</p>
        </div>
      )}
    </div>
  );
}

// ─── SVARGA CHAT ─────────────────────────────────────────────────────────────
function SvargaLayer({lang}){
  const t=T[lang];
  const [msgs,setMsgs]=React.useState([
    {role:'svarga',text:t.svarga_greeting}
  ]);
  const [input,setInput]=React.useState('');
  const [typing,setTyping]=React.useState(false);
  const endRef=React.useRef(null);
  React.useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,typing]);
  function send(){
    const txt=input.trim();
    if(!txt)return;
    setInput('');
    setMsgs(m=>[...m,{role:'user',text:txt}]);
    setTyping(true);
    setTimeout(()=>{
      const reply=generateSvarga(txt,lang);
      setMsgs(m=>[...m,{role:'svarga',text:reply}]);
      setTyping(false);
    },1600+Math.random()*800);
  }
  return(
    <div style={{maxWidth:680,margin:'0 auto',padding:'0 16px 20px',display:'flex',flexDirection:'column',height:'calc(100vh - 200px)'}}>
      <div style={{textAlign:'center',marginBottom:20,flexShrink:0}}>
        <div style={{fontSize:32,marginBottom:4}}>🌿</div>
        <h2 style={{fontFamily:'var(--font-d)',color:'var(--purple)',fontSize:22,margin:0,fontWeight:400}}>{t.svarga_title}</h2>
        <p style={{fontFamily:'var(--font-b)',fontSize:12,color:'rgba(200,212,224,.5)',margin:'6px 0 0'}}>{t.svarga_sub}</p>
      </div>
      <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:12,paddingBottom:8}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',gap:10,alignItems:'flex-end',
            flexDirection:m.role==='user'?'row-reverse':'row'}}>
            {m.role==='svarga'&&(
              <div style={{width:32,height:32,borderRadius:'50%',flexShrink:0,
                background:'linear-gradient(135deg,#B07ECC,#7E8EC8)',
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🌿</div>
            )}
            <div style={{maxWidth:'78%',padding:'12px 16px',borderRadius:16,
              background:m.role==='user'?'linear-gradient(135deg,#B07ECC99,#7E8EC888)':'var(--glass-bg)',
              border:m.role==='user'?'none':'1px solid rgba(176,126,204,.15)',
              color:m.role==='user'?'#0A0907':'var(--platinum)',
              fontFamily:'var(--font-b)',fontSize:13,lineHeight:1.7,whiteSpace:'pre-line',
              borderBottomRightRadius:m.role==='user'?4:16,
              borderBottomLeftRadius:m.role==='svarga'?4:16}}>
              {m.text}
            </div>
          </div>
        ))}
        {typing&&(
          <div style={{display:'flex',gap:10,alignItems:'flex-end'}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,#B07ECC,#7E8EC8)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🌿</div>
            <div style={{padding:'12px 16px',borderRadius:16,borderBottomLeftRadius:4,background:'var(--glass-bg)',border:'1px solid rgba(176,126,204,.15)'}}>
              <span style={{display:'inline-flex',gap:4}}>
                {[0,1,2].map(i=>(
                  <span key={i} style={{width:6,height:6,borderRadius:'50%',background:'var(--purple)',
                    animation:'pulse 1.2s ease-in-out infinite',animationDelay:`${i*0.2}s`,display:'inline-block'}}/>
                ))}
              </span>
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>
      <div style={{display:'flex',gap:8,marginTop:8,flexShrink:0}}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}
          placeholder={t.svarga_ph||t.chat_placeholder}
          style={{flex:1,background:'var(--glass-bg)',border:'1px solid rgba(176,126,204,.2)',
            borderRadius:12,padding:'12px 16px',color:'var(--platinum)',
            fontFamily:'var(--font-b)',fontSize:13,outline:'none'}}/>
        <button onClick={send}
          style={{background:'linear-gradient(135deg,#B07ECC,#7E8EC8)',border:'none',
            borderRadius:12,padding:'12px 18px',color:'#fff',cursor:'pointer',fontWeight:700,fontSize:15}}>→</button>
      </div>
    </div>
  );
}

// ─── COACH LAYER ─────────────────────────────────────────────────────────────
function CoachLayer({lang,view,setView,selectedCoach,setSelectedCoach}){
  const t=T[lang];
  if(view==='chat'&&selectedCoach){
    return <ChatInterface coach={selectedCoach} lang={lang}
      onBack={()=>{setView('profile');}}/>;
  }
  if(view==='profile'&&selectedCoach){
    return <CoachProfile coach={selectedCoach} lang={lang}
      onBack={()=>{setView('home');setSelectedCoach(null);}}
      onStartChat={(c)=>{setSelectedCoach(c);setView('chat');}}/>;
  }
  // Coach grid
  return(
    <div style={{maxWidth:900,margin:'0 auto',padding:'0 16px 60px'}}>
      <div style={{textAlign:'center',marginBottom:36}}>
        <h2 style={{fontFamily:'var(--font-d)',fontSize:'clamp(1.6rem,3vw,2.2rem)',color:'var(--platinum)',
          margin:0,fontWeight:400}}>{t.coaches_title}</h2>
        <p style={{fontFamily:'var(--font-b)',fontSize:13,color:'rgba(200,212,224,.5)',marginTop:8}}>{t.coaches_sub}</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:16}}>
        {COACHES.map(c=>(
          <CoachCard key={c.id} coach={c} lang={lang}
            onSelect={coach=>{setSelectedCoach(coach);setView('profile');}}/>
        ))}
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=React.useState('en');
  const [theme,setTheme]=React.useState('dark');
  const [layer,setLayer]=React.useState('coach');
  const [view,setView]=React.useState('home');
  const [selectedCoach,setSelectedCoach]=React.useState(null);

  // Apply theme + dir + data-layer
  React.useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    document.documentElement.setAttribute('dir',lang==='he'?'rtl':'ltr');
    document.documentElement.setAttribute('data-layer',layer);
  },[theme,lang,layer]);

  // Scroll reveal
  useReveal();

  const t=T[lang];
  const showHero=layer==='coach'&&view==='home';
  const isChatFull=(view==='chat');

  return(
    <React.Fragment>
      {!isChatFull&&<Nav lang={lang} setLang={setLang} theme={theme} setTheme={setTheme}
        layer={layer} setLayer={l=>{setLayer(l);setView('home');setSelectedCoach(null);}}
        setView={setView}/>}
      <main style={{minHeight:'100vh',paddingTop:isChatFull?0:60}}>
        {!isChatFull&&showHero&&(
          <Hero lang={lang} setLayer={l=>{setLayer(l);setView('home');}} layer={layer}/>
        )}
        {!isChatFull&&(
          <div style={{paddingTop:showHero?0:32}}>
            <LayerTabs layer={layer} setLayer={l=>{setLayer(l);setView('home');setSelectedCoach(null);}} lang={lang}/>
          </div>
        )}
        {layer==='coach'&&(
          <CoachLayer lang={lang} view={view} setView={setView}
            selectedCoach={selectedCoach} setSelectedCoach={setSelectedCoach}/>
        )}
        {layer==='esoteric'&&<EsotericLayer lang={lang}/>}
        {layer==='svarga'&&<SvargaLayer lang={lang}/>}
      </main>
      {!isChatFull&&<Footer lang={lang}/>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
