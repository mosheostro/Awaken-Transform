<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23C8A86E'/><text x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='18' fill='%230D0B08'>L</text></svg>">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0B08;
      --bg-alt:    #141108;
      --surface:   #1B1710;
      --surface-2: #232018;
      --text-1:    #EDE9E2;
      --text-2:    #A8A49C;
      --text-3:    #6B6762;
      --border:    rgba(237,233,226,.09);
      --border-md: rgba(237,233,226,.17);
      --gold:      #C8A86E;
      --gold-h:    #DDBB7E;
      --gold-dim:  #9A7E4A;
      --gold-f:    rgba(200,168,110,.10);
      --sage:      #6EA080;
      --shadow:    rgba(0,0,0,.65);
      --nav-bg:    rgba(13,11,8,.94);
      --font-d: 'Cormorant Garamond', Georgia, serif;
      --font-b: 'DM Sans', system-ui, sans-serif;
      --r: 4px;
    }
    [data-theme="light"] {
      --bg:        #FAF7F0;
      --bg-alt:    #F2EFE7;
      --surface:   #FFFFFF;
      --surface-2: #EDE9E0;
      --text-1:    #1C1810;
      --text-2:    #5A5650;
      --text-3:    #9A9590;
      --border:    rgba(28,24,16,.09);
      --border-md: rgba(28,24,16,.18);
      --gold:      #8B6520;
      --gold-h:    #724F12;
      --gold-dim:  #B08030;
      --gold-f:    rgba(139,101,32,.09);
      --sage:      #3A7556;
      --shadow:    rgba(0,0,0,.10);
      --nav-bg:    rgba(250,247,240,.96);
    }
    /* Hebrew font swap */
    [lang="he"] { --font-d: 'Frank Ruhl Libre', Georgia, serif; --font-b: 'Heebo', system-ui, sans-serif; }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text-1);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
    ::selection { background: rgba(200,168,110,.22); }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font-b); }

    .sp  { padding: clamp(64px,9vw,120px) clamp(24px,7vw,100px); }
    .sp2 { padding: clamp(44px,6vw,88px) clamp(24px,7vw,100px); }
    .mw  { max-width: 1280px; margin: 0 auto; }

    .rv  { opacity:0; transform:translateY(20px); transition:opacity .8s cubic-bezier(.2,0,.2,1),transform .8s cubic-bezier(.2,0,.2,1); }
    .rv.in { opacity:1; transform:none; }
    .d1{transition-delay:.10s}.d2{transition-delay:.22s}.d3{transition-delay:.34s}
    .d4{transition-delay:.46s}.d5{transition-delay:.58s}.d6{transition-delay:.70s}

    .eyebrow {
      font-family:var(--font-b); font-size:.64rem; font-weight:500;
      letter-spacing:.22em; text-transform:uppercase; color:var(--gold);
    }
    [lang="he"] .eyebrow { letter-spacing:.08em; }

    .btn-p {
      display:inline-flex; align-items:center; gap:8px;
      padding:13px 34px; background:var(--gold); color:#0D0B08;
      font-size:.76rem; font-weight:500; letter-spacing:.13em; text-transform:uppercase;
      border:none; border-radius:var(--r); cursor:pointer;
      transition:background .3s,transform .25s,box-shadow .3s;
    }
    .btn-p:hover { background:var(--gold-h); transform:translateY(-2px); box-shadow:0 14px 40px rgba(200,168,110,.28); }
    .btn-g {
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 32px; background:transparent; color:var(--text-2);
      font-size:.76rem; font-weight:400; letter-spacing:.09em; text-transform:uppercase;
      border:1px solid var(--border-md); border-radius:var(--r); cursor:pointer;
      transition:border-color .3s,color .3s;
    }
    .btn-g:hover { border-color:var(--gold); color:var(--gold); }

    /* NAV */
    .nav-wrap {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 clamp(20px,5.5vw,72px); height:68px;
      background:transparent;
      transition:background .4s,border-color .4s,backdrop-filter .4s;
    }
    .nav-wrap.scrolled {
      background:var(--nav-bg);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      border-bottom:1px solid var(--border);
    }
    .nav-logo { display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; }
    .nav-logo-mark { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-dim)); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-size:1.05rem; color:#0D0B08; font-weight:600; flex-shrink:0; }
    .nav-logo-name { font-family:var(--font-d); font-size:1rem; font-weight:400; color:var(--text-1); letter-spacing:.03em; display:block; line-height:1.1; }
    .nav-logo-sub  { font-size:.56rem; color:var(--gold); letter-spacing:.20em; text-transform:uppercase; display:block; line-height:1.1; }
    .nav-right { display:flex; align-items:center; gap:10px; }

    .ctrl-btn {
      background:none; border:1px solid var(--border-md); border-radius:var(--r);
      padding:6px 12px; cursor:pointer;
      font-size:.66rem; font-weight:500; letter-spacing:.10em; color:var(--text-3);
      transition:border-color .2s,color .2s; white-space:nowrap;
      display:flex; align-items:center; gap:5px;
    }
    .ctrl-btn:hover { border-color:var(--gold); color:var(--gold); }

    .lang-wrap { position:relative; }
    .lang-drop {
      position:absolute; top:calc(100% + 7px); right:0;
      background:var(--surface); border:1px solid var(--border-md);
      border-radius:var(--r); min-width:120px; overflow:hidden;
      box-shadow:0 14px 40px var(--shadow);
      opacity:0; pointer-events:none; transform:translateY(-4px);
      transition:opacity .2s,transform .2s;
    }
    [dir="rtl"] .lang-drop { right:auto; left:0; }
    .lang-drop.open { opacity:1; pointer-events:all; transform:none; }
    .lang-opt {
      display:block; width:100%; padding:9px 14px; background:none; border:none;
      text-align:left; cursor:pointer; font-size:.73rem; color:var(--text-2);
      transition:background .15s,color .15s;
    }
    [dir="rtl"] .lang-opt { text-align:right; }
    .lang-opt:hover { background:var(--gold-f); color:var(--gold); }
    .lang-opt.active { color:var(--gold); font-weight:500; }

    .mob-drawer {
      position:fixed; inset:0; z-index:200;
      background:rgba(13,11,8,.97); backdrop-filter:blur(20px);
      display:flex; flex-direction:column; padding:80px 36px 48px;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    [data-theme="light"] .mob-drawer { background:rgba(250,247,240,.97); }
    .mob-drawer.open { opacity:1; pointer-events:all; }

    /* HERO */
    @keyframes hfade { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
    .hl1{animation:hfade 1s cubic-bezier(.2,0,.2,1) .25s both}
    .hl2{animation:hfade 1s cubic-bezier(.2,0,.2,1) .45s both}
    .hl3{animation:hfade 1s cubic-bezier(.2,0,.2,1) .65s both}
    .hl4{animation:hfade 1s cubic-bezier(.2,0,.2,1) .85s both}

    .portal-hero {
      min-height:60vh; display:flex; align-items:center; justify-content:center;
      text-align:center; position:relative; overflow:hidden;
      padding:clamp(110px,15vw,170px) clamp(24px,6vw,80px) clamp(48px,7vw,90px);
    }
    .portal-hero::before {
      content:''; position:absolute; inset:0; z-index:0;
      background:radial-gradient(ellipse 80% 60% at 50% 40%, rgba(200,168,110,.10) 0%, transparent 70%);
    }
    .portal-hero-content { position:relative; z-index:1; max-width:780px; }

    /* CATEGORY SECTIONS */
    .cat-wrap { padding:0 clamp(24px,7vw,100px); }
    .cat-section { max-width:1280px; margin:0 auto; padding-bottom:clamp(60px,8vw,110px); }
    .cat-header { display:flex; align-items:center; gap:18px; margin-bottom:30px; }
    .cat-num { font-family:var(--font-d); font-size:1.6rem; color:var(--gold); font-weight:300; line-height:1; }
    .cat-line { flex:1; height:1px; background:var(--border-md); }
    .cat-title { font-family:var(--font-d); font-size:clamp(20px,2.5vw,28px); font-weight:400; color:var(--text-1); letter-spacing:.01em; }
    .cat-sub { font-size:.74rem; color:var(--text-3); letter-spacing:.05em; max-width:560px; margin-bottom:36px; line-height:1.7; }

    .cards-grid {
      display:grid; grid-template-columns:repeat(2,1fr); gap:20px;
    }
    @media(max-width:840px){ .cards-grid { grid-template-columns:1fr; } }

    .s-card {
      position:relative; overflow:hidden;
      background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:38px 32px 32px;
      cursor:pointer; transition:transform .35s,border-color .35s,box-shadow .35s;
      display:flex; flex-direction:column;
    }
    .s-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:var(--card-accent, var(--gold)); opacity:.78; transition:opacity .35s;
    }
    .s-card:hover { transform:translateY(-7px); border-color:var(--border-md); box-shadow:0 24px 64px var(--shadow); }
    .s-card:hover::before { opacity:1; }

    .s-card-art {
      position:absolute; top:18px; right:22px;
      width:62px; height:62px; opacity:.85; pointer-events:none;
      color:var(--card-accent,var(--gold));
    }
    [dir="rtl"] .s-card-art { right:auto; left:22px; }
    .s-card-tag  { font-size:.60rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--card-accent,var(--gold)); margin-bottom:14px; }
    .s-card-name { font-family:var(--font-d); font-size:clamp(24px,3vw,32px); font-weight:400; color:var(--text-1); line-height:1.1; margin-bottom:5px; padding-right:60px; }
    [dir="rtl"] .s-card-name { padding-right:0; padding-left:60px; }
    .s-card-ttl  { font-size:.78rem; color:var(--text-2); font-weight:400; letter-spacing:.03em; margin-bottom:18px; }
    .s-card-tl   { font-family:var(--font-d); font-size:1.02rem; font-style:italic; color:var(--text-2); line-height:1.6; margin-bottom:20px; flex:1; }
    .s-card-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px; }
    .s-card-pill { font-size:.58rem; letter-spacing:.10em; text-transform:uppercase; padding:5px 11px; background:var(--gold-f); color:var(--text-2); border-radius:20px; border:1px solid var(--border); white-space:nowrap; }
    .s-card-cta  {
      display:inline-flex; align-items:center; gap:8px;
      font-size:.72rem; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
      color:var(--card-accent,var(--gold)); background:none; border:none; cursor:pointer; padding:0;
      transition:gap .2s;
    }
    .s-card-cta:hover { gap:13px; }

    /* SPECIALIST DETAIL */
    .sp-back {
      position:fixed; top:18px; left:clamp(18px,4vw,56px); z-index:400;
      display:flex; align-items:center; gap:7px;
      background:var(--surface); border:1px solid var(--border-md);
      border-radius:20px; padding:8px 16px; cursor:pointer;
      font-size:.70rem; font-weight:500; letter-spacing:.09em; text-transform:uppercase;
      color:var(--text-2); transition:border-color .2s,color .2s; white-space:nowrap;
    }
    [dir="rtl"] .sp-back { left:auto; right:clamp(18px,4vw,56px); }
    .sp-back:hover { border-color:var(--gold); color:var(--gold); }

    .sp-hero {
      min-height:48vh; display:flex; align-items:flex-end;
      padding:clamp(110px,14vw,160px) clamp(24px,7vw,100px) clamp(44px,6vw,72px);
      position:relative; overflow:hidden;
    }
    .sp-hero::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse 90% 70% at 15% 80%, var(--hero-glow,rgba(200,168,110,.13)) 0%, transparent 60%);
    }
    [dir="rtl"] .sp-hero::before {
      background:radial-gradient(ellipse 90% 70% at 85% 80%, var(--hero-glow,rgba(200,168,110,.13)) 0%, transparent 60%);
    }
    .sp-hero-content { position:relative; z-index:1; max-width:820px; }
    .sp-hero-art { position:absolute; top:50%; right:clamp(40px,8vw,140px); transform:translateY(-50%); width:clamp(140px,20vw,260px); height:auto; opacity:.55; pointer-events:none; z-index:0; }
    [dir="rtl"] .sp-hero-art { right:auto; left:clamp(40px,8vw,140px); }
    @media(max-width:768px){ .sp-hero-art { display:none; } }

    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:clamp(32px,5vw,72px); align-items:start; }
    @media(max-width:768px){ .detail-grid { grid-template-columns:1fr; } }

    .prog-card {
      padding:30px 26px; border-radius:8px; border:1px solid var(--border);
      background:var(--surface); transition:border-color .3s,transform .3s;
    }
    .prog-card:hover { border-color:var(--border-md); transform:translateY(-3px); }
    .prog-num { font-family:var(--font-d); font-size:2rem; font-weight:300; line-height:1; margin-bottom:14px; }

    .stat-row { display:flex; gap:clamp(22px,4vw,52px); flex-wrap:wrap; }
    .stat-num { font-family:var(--font-d); font-size:clamp(28px,3.5vw,38px); font-weight:400; line-height:1; display:block; }
    .stat-lbl { font-size:.66rem; color:var(--text-3); letter-spacing:.12em; text-transform:uppercase; display:block; margin-top:3px; }

    .tcard {
      padding:28px; border-radius:8px; border:1px solid var(--border);
      background:var(--gold-f); margin-bottom:16px;
    }
    .tcard:last-child { margin-bottom:0; }
    .tcard-name { font-size:.76rem; font-weight:500; color:var(--text-1); }
    .tcard-city { font-size:.64rem; color:var(--text-3); letter-spacing:.08em; }
    .tcard-text { font-family:var(--font-d); font-size:1.02rem; font-style:italic; color:var(--text-2); line-height:1.68; margin-top:14px; }

    .cta-strip {
      text-align:center; padding:clamp(64px,9vw,110px) clamp(24px,7vw,100px);
      background:var(--bg-alt); position:relative; overflow:hidden;
    }
    .cta-strip::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse 60% 80% at 50% 100%, rgba(200,168,110,.10),transparent);
    }

    .footer-bar {
      padding:clamp(36px,5vw,60px) clamp(24px,7vw,100px) clamp(28px,4vw,44px);
      border-top:1px solid var(--border);
      display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center;
    }
    .f-credit { font-size:.74rem; color:var(--text-2); letter-spacing:.04em; }
    .f-credit a { color:var(--gold); border-bottom:1px solid transparent; transition:border-color .2s; }
    .f-credit a:hover { border-bottom-color:var(--gold); }
    .f-copy { font-size:.65rem; color:var(--text-3); letter-spacing:.04em; }

    .wa-float {
      position:fixed; bottom:26px; right:26px; z-index:150;
      width:54px; height:54px; border-radius:50%;
      background:#25D366; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 28px rgba(37,211,102,.35);
      transition:transform .25s,box-shadow .25s; text-decoration:none;
    }
    .wa-float:hover { transform:scale(1.08) translateY(-2px); }
    [dir="rtl"] .wa-float { right:auto; left:26px; }

    @media(max-width:768px){
      .dsk{ display:none!important; }
      .mob-only-hide{ display:none!important; }
    }
    @media(min-width:769px){ .mob-only{ display:none!important; } }
  </style>
</head>

          {name:'איך להשתמש',city:'רפלקציה, לא גורל',text:'קרא את הניתוח. שים לב למה שמתחבר. למה שמרגיש מתוח. המחשבות שעולות בך הן החומר האמיתי — לא המטריצה עצמה.'},
        ],
      },
    ],
  };

  /* ─── Icons ─── */
  const IcoArrowR = ({s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
  const IcoArrowL = ({s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
  const IcoSun = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
  const IcoMoon = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>;
  const IcoWA = ({s=26}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>;
  const IcoTG = ({s=18}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.94z"/></svg>;

  /* ─── Hook ─── */
  function useReveal(dep) {
    React.useEffect(() => {
      const obs = new IntersectionObserver(
        es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }),
        { threshold: 0.07 }
      );
      const timer = setTimeout(() => {
        document.querySelectorAll('.rv').forEach(el => { el.classList.remove('in'); obs.observe(el); });
      }, 80);
      return () => { clearTimeout(timer); obs.disconnect(); };
    }, [dep]);
  }

  /* ─── Nav ─── */
  function Nav({ lang, setLang, theme, toggleTheme, isPortal, onBack }) {
    const ui = UI[lang];
    const [scrolled, setScrolled] = React.useState(false);
    const [langOpen, setLangOpen] = React.useState(false);
    const [mobOpen,  setMobOpen]  = React.useState(false);

    React.useEffect(() => {
      const fn = () => setScrolled(window.scrollY > 50);
      window.addEventListener('scroll', fn, { passive:true });
      return () => window.removeEventListener('scroll', fn);
    }, []);

    React.useEffect(() => {
      if (!langOpen) return;
      const close = () => setLangOpen(false);
      setTimeout(() => document.addEventListener('click', close), 0);
      return () => document.removeEventListener('click', close);
    }, [langOpen]);

    const LANGS = [{c:'en',l:'English'},{c:'ru',l:'Русский'},{c:'de',l:'Deutsch'},{c:'he',l:'עברית'}];

    return (
      <>
        <nav className={`nav-wrap${scrolled?' scrolled':''}`}>
          <button className="nav-logo" onClick={onBack}>
            <span className="nav-logo-mark">L</span>
            <div><span className="nav-logo-name">LifeForge</span><span className="nav-logo-sub">AI · by G. Rivera</span></div>
          </button>

          <div className="nav-right dsk">
            <div className="lang-wrap" onClick={e=>e.stopPropagation()}>
              <button className="ctrl-btn" onClick={()=>setLangOpen(!langOpen)}>
                {lang.toUpperCase()} <span style={{opacity:.45,fontSize:9}}>▾</span>
              </button>
              <div className={`lang-drop${langOpen?' open':''}`}>
                {LANGS.map(l=>(
                  <button key={l.c} className={`lang-opt${lang===l.c?' active':''}`}
                    onClick={()=>{setLang(l.c);setLangOpen(false);}}>
                    {l.l}
                  </button>
                ))}
              </div>
            </div>
            <button className="ctrl-btn" onClick={toggleTheme}>
              {theme==='dark'?<IcoSun/>:<IcoMoon/>}
              {theme==='dark'?ui.themeL:ui.themeD}
            </button>
            {!isPortal && (
              <button className="btn-g" style={{padding:'8px 18px',fontSize:'.69rem'}} onClick={onBack}>
                <IcoArrowL s={12}/> {ui.back}
              </button>
            )}
          </div>

          <button className="mob-only ctrl-btn" style={{letterSpacing:'.04em',borderRadius:6}}
            onClick={()=>setMobOpen(true)}>☰</button>
        </nav>

        <div className={`mob-drawer${mobOpen?' open':''}`}>
          <button style={{position:'absolute',top:20,right:22,background:'none',border:'none',color:'var(--text-2)',fontSize:'1.3rem',cursor:'pointer'}}
            onClick={()=>setMobOpen(false)}>✕</button>
          <div style={{display:'flex',flexDirection:'column',gap:18,paddingTop:8}}>
            {LANGS.map(l=>(
              <button key={l.c} style={{background:'none',border:'none',cursor:'pointer',textAlign:'left',
                font:`500 1.05rem/1 var(--font-b)`,letterSpacing:'.06em',
                color:lang===l.c?'var(--gold)':'var(--text-2)'}}
                onClick={()=>{setLang(l.c);setMobOpen(false);}}>
                {l.l}
              </button>
            ))}
            <div style={{height:1,background:'var(--border)',margin:'4px 0'}}/>
            <button style={{background:'none',border:'none',cursor:'pointer',textAlign:'left',
              font:'400 .88rem/1 var(--font-b)',color:'var(--text-2)',letterSpacing:'.08em'}}
              onClick={()=>{toggleTheme();setMobOpen(false);}}>
              {theme==='dark'?'☀ Light Mode':'☾ Dark Mode'}
            </button>
            {!isPortal&&(
              <button style={{background:'none',border:'none',cursor:'pointer',textAlign:'left',
                font:'400 .88rem/1 var(--font-b)',color:'var(--text-2)',letterSpacing:'.08em'}}
                onClick={()=>{onBack();setMobOpen(false);}}>
                ← {ui.back}
              </button>
            )}
          </div>
        </div>
      </>
    );
  }

  /* ─── Card ─── */
  function Card({ s, ui, onSelect, idx }) {
    const Art = ART[s.art];
    return (
      <div className={`s-card rv d${idx+1}`} style={{'--card-accent':s.accent}} onClick={()=>onSelect(s.id)}>
        <div className="s-card-art"><Art c={s.accent}/></div>
        <div className="s-card-tag">{s.tag}</div>
        <div className="s-card-name">{s.name}</div>
        <div className="s-card-ttl">{s.title}</div>
        <div className="s-card-tl">"{s.tagline}"</div>
        <div className="s-card-pills">{s.pills.map(p=><span key={p} className="s-card-pill">{p}</span>)}</div>
        <button className="s-card-cta">{ui.explore} <IcoArrowR s={12}/></button>
      </div>
    );
  }

  /* ─── Portal ─── */
  function Portal({ lang, onSelect }) {
    const ui   = UI[lang];
    const specs = SPECS[lang];
    const primary = specs.filter(s=>s.cat==='primary');
    const secondary = specs.filter(s=>s.cat==='secondary');
    useReveal(lang);

    return (
      <>
        <section className="portal-hero">
          <div className="portal-hero-content">
            <div className="eyebrow hl1" style={{marginBottom:20}}>{ui.portal.eyebrow}</div>
            <h1 className="hl2" style={{fontFamily:'var(--font-d)',fontWeight:400,fontSize:'clamp(40px,6.5vw,82px)',lineHeight:1.08,color:'var(--text-1)',letterSpacing:'-.02em',marginBottom:22}}>
              {ui.portal.h1a}<br/>
              <em style={{color:'var(--gold)',fontStyle:'italic'}}>{ui.portal.h1b}</em>
            </h1>
            <p className="hl3" style={{fontFamily:'var(--font-d)',fontSize:'clamp(16px,2vw,20px)',color:'var(--text-2)',lineHeight:1.7,maxWidth:620,margin:'0 auto 30px'}}>
              {ui.portal.sub}
            </p>
            <div className="hl4" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,color:'var(--text-3)',fontSize:'.66rem',letterSpacing:'.18em',textTransform:'uppercase'}}>
              <span style={{width:20,height:1,background:'var(--border-md)'}}/>
              {ui.portal.hint}
              <span style={{width:20,height:1,background:'var(--border-md)'}}/>
            </div>
          </div>
        </section>

        <div className="cat-wrap">
          {/* PRIMARY: Coaching & Psychology */}
          <section className="cat-section">
            <div className="cat-header rv">
              <span className="cat-num">I</span>
              <span className="cat-title">{ui.cat.primary}</span>
              <span className="cat-line"/>
            </div>
            <p className="cat-sub rv d1">{ui.cat.primarySub}</p>
            <div className="cards-grid">
              {primary.map((s,i)=><Card key={s.id} s={s} ui={ui} onSelect={onSelect} idx={i}/>)}
            </div>
          </section>

          {/* SECONDARY: Esoteric */}
          <section className="cat-section">
            <div className="cat-header rv">
              <span className="cat-num">II</span>
              <span className="cat-title">{ui.cat.secondary}</span>
              <span className="cat-line"/>
            </div>
            <p className="cat-sub rv d1">{ui.cat.secondary_sub || ui.cat.secondarySub}</p>
            <div className="cards-grid">
              {secondary.map((s,i)=><Card key={s.id} s={s} ui={ui} onSelect={onSelect} idx={i}/>)}
            </div>
          </section>
        </div>
      </>
    );
  }

  /* ─── Specialist Detail ─── */
  function SpecDetail({ lang, specId, onBack }) {
    const ui = UI[lang];
    const s  = SPECS[lang].find(x=>x.id===specId);
    useReveal(specId+lang);
    if (!s) return null;
    const Art = ART[s.art];

    return (
      <div>
        <button className="sp-back" onClick={onBack}><IcoArrowL s={12}/> {ui.back}</button>

        {/* Hero */}
        <section className="sp-hero" style={{'--hero-glow':s.glow}}>
          <div className="sp-hero-art mob-only-hide"><Art size={260} c={s.accent}/></div>
          <div className="sp-hero-content">
            <div className="eyebrow hl1" style={{color:s.accent,marginBottom:16}}>{s.tag} · LifeForge AI</div>
            <h1 className="hl2" style={{fontFamily:'var(--font-d)',fontWeight:400,fontSize:'clamp(38px,6vw,76px)',lineHeight:1.07,color:'var(--text-1)',letterSpacing:'-.02em',marginBottom:14}}>
              {s.name}
            </h1>
            <p className="hl3" style={{fontFamily:'var(--font-d)',fontSize:'clamp(15px,1.6vw,18px)',color:'var(--text-2)',lineHeight:1.55,maxWidth:640,marginBottom:14}}>
              {s.title}
            </p>
            <p className="hl3" style={{fontFamily:'var(--font-d)',fontSize:'clamp(14px,1.5vw,17px)',fontStyle:'italic',color:'var(--text-3)',lineHeight:1.65,maxWidth:640,marginBottom:24}}>
              "{s.tagline}"
            </p>
            <div className="hl4" style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {s.pills.map(p=>(
                <span key={p} style={{fontSize:'.60rem',letterSpacing:'.12em',textTransform:'uppercase',padding:'6px 14px',background:'rgba(255,255,255,.06)',border:`1px solid ${s.accent}44`,borderRadius:20,color:s.accent}}>{p}</span>
              ))}
            </div>
          </div>
        </section>

        {/* About */}
        <section className="sp2" style={{background:'var(--bg-alt)'}}>
          <div className="mw">
            <div className="detail-grid">
              <div>
                <div className="eyebrow rv" style={{color:s.accent,marginBottom:14}}>{s.about.eyebrow}</div>
                <h2 className="rv d1" style={{fontFamily:'var(--font-d)',fontWeight:400,fontSize:'clamp(26px,3.8vw,42px)',lineHeight:1.15,color:'var(--text-1)',marginBottom:22,letterSpacing:'-.01em'}}>
                  {s.about.h2}
                </h2>
                <p className="rv d2" style={{fontSize:'.91rem',color:'var(--text-2)',lineHeight:1.82,marginBottom:14,fontWeight:300}}>{s.about.bio}</p>
                <p className="rv d3" style={{fontSize:'.86rem',color:'var(--text-3)',lineHeight:1.78,fontWeight:300,fontStyle:'italic'}}>{s.about.bio2}</p>
              </div>
              <div className="rv d2">
                <div style={{borderRadius:8,overflow:'hidden',border:`1px solid ${s.accent}38`,aspectRatio:'4/3',position:'relative',marginBottom:24,
                  background:`radial-gradient(ellipse at 30% 30%, ${s.accent}25, var(--surface) 75%)`}}>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <Art size={180} c={s.accent}/>
                  </div>
                </div>
                <div className="stat-row">
                  {s.stats.map(st=>(
                    <div key={st.l}>
                      <span className="stat-num" style={{color:s.accent}}>{st.n}</span>
                      <span className="stat-lbl">{st.l}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Framework (if exists) */}
        {s.framework && (
          <section className="sp2">
            <div className="mw">
              <div style={{textAlign:'center',marginBottom:44}}>
                <div className="eyebrow rv" style={{color:s.accent,marginBottom:14}}>{s.framework.eyebrow}</div>
                <h2 className="rv d1" style={{fontFamily:'var(--font-d)',fontWeight:400,fontSize:'clamp(24px,3.4vw,38px)',color:'var(--text-1)',letterSpacing:'-.01em'}}>{s.framework.h2}</h2>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:18}}>
                {s.framework.pillars.map((p,i)=>(
                  <div key={p.n+i} className={`prog-card rv d${i+1}`}>
                    <div style={{fontSize:'.58rem',letterSpacing:'.16em',textTransform:'uppercase',color:s.accent,marginBottom:12}}>{p.n}</div>
                    <div style={{fontFamily:'var(--font-d)',fontSize:'1.18rem',fontWeight:400,color:'var(--text-1)',marginBottom:12}}>{p.title}</div>
                    <div style={{fontSize:'.83rem',color:'var(--text-2)',lineHeight:1.78,fontWeight:300}}>{p.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        )}

        {/* Programs */}
        <section className="sp2" style={{background:s.framework?'var(--bg-alt)':'var(--bg)'}}>
          <div className="mw">
            <div className="eyebrow rv" style={{color:s.accent,marginBottom:32}}>{ui.programs}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:18}}>
              {s.programs.map((p,i)=>(
                <div key={p.num} className={`prog-card rv d${i+1}`}>
                  <div className="prog-num" style={{color:s.accent}}>{p.num}</div>
                  <div style={{fontFamily:'var(--font-d)',fontSize:'1.18rem',fontWeight:400,color:'var(--text-1)',marginBottom:10,lineHeight:1.3}}>{p.title}</div>
                  <div style={{fontSize:'.84rem',color:'var(--text-2)',lineHeight:1.78,fontWeight:300,marginBottom:16}}>{p.desc}</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                    {p.tags.map(t=>(
                      <span key={t} style={{fontSize:'.58rem',letterSpacing:'.09em',textTransform:'uppercase',padding:'4px 10px',background:'var(--gold-f)',border:'1px solid var(--border)',borderRadius:20,color:'var(--text-3)'}}>{t}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* Testimonials / Quotes */}
        <section className="sp2" style={{background:s.framework?'var(--bg)':'var(--bg-alt)'}}>
          <div className="mw">
            <div className="eyebrow rv" style={{color:s.accent,marginBottom:32}}>{ui.testimonials}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16}}>
              {s.testimonials.map((tm,i)=>(
                <div key={tm.name+i} className={`tcard rv d${i+1}`}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div><div className="tcard-name">{tm.name}</div><div className="tcard-city">{tm.city}</div></div>
                    <div style={{fontFamily:'var(--font-d)',fontSize:'2.2rem',color:s.accent,lineHeight:1,opacity:.35}}>"</div>
                  </div>
                  <div className="tcard-text">{tm.text}</div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* CTA */}
        <section className="cta-strip">
          <div style={{position:'relative',zIndex:1}}>
            <h2 className="rv" style={{fontFamily:'var(--font-d)',fontWeight:400,fontSize:'clamp(28px,5vw,52px)',color:'var(--text-1)',lineHeight:1.1,marginBottom:14,letterSpacing:'-.01em'}}>
              {ui.cta.title}
            </h2>
            <p className="rv d1" style={{fontSize:'.88rem',color:'var(--text-2)',marginBottom:32,lineHeight:1.7,maxWidth:460,margin:'0 auto 32px'}}>
              {ui.cta.sub}
            </p>
            <div className="rv d2" style={{display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap'}}>
              <a href={WHATSAPP} target="_blank" rel="noopener" className="btn-p">{ui.cta.wa}</a>
              <a href={TELEGRAM} target="_blank" rel="noopener" className="btn-g"><IcoTG s={16}/> {ui.cta.tg}</a>
            </div>
          </div>
        </section>
      </div>
    );
  }

  /* ─── Footer ─── */
  function Footer({ lang }) {
    const t = UI[lang].footer;
    return (
      <footer className="footer-bar">
        <div className="f-credit">{t.credit} <a href={AUTHOR_URL} target="_blank" rel="noopener">{t.author}</a> · <a href={AUTHOR_URL} target="_blank" rel="noopener">georgiirivera.ai</a></div>
        <div className="f-copy">{t.copy}</div>
      </footer>
    );
  }

  /* ─── App ─── */
  function App() {
    const [lang,  setLang]  = React.useState('en');
    const [theme, setTheme] = React.useState('dark');
    const [view,  setView]  = React.useState('portal');

    React.useEffect(() => {
      document.documentElement.setAttribute('data-theme', theme);
    }, [theme]);

    React.useEffect(() => {
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
    }, [lang]);

    const toggleTheme = () => setTheme(t => t==='dark'?'light':'dark');
    const openSpec = (id) => { setView(id); window.scrollTo({top:0,behavior:'instant'}); };
    const goPortal = ()   => { setView('portal'); window.scrollTo({top:0,behavior:'instant'}); };

    const isPortal = view === 'portal';

    return (
      <>
        <Nav lang={lang} setLang={setLang} theme={theme} toggleTheme={toggleTheme} isPortal={isPortal} onBack={goPortal}/>
        {isPortal
          ? <Portal lang={lang} onSelect={openSpec}/>
          : <SpecDetail lang={lang} specId={view} onBack={goPortal}/>
        }
        <Footer lang={lang}/>
        <a href={WHATSAPP} target="_blank" rel="noopener" className="wa-float" aria-label="WhatsApp"><IcoWA s={26}/></a>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
